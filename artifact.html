<title>DMS Puerto a Puerta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  /* Identidad: azul eléctrico #155EEF (principal) · naranja #FF7A00 (acción)
     verde #16A34A (éxito) · fondo #F8FAFC · texto #0F172A · bordes #E2E8F0 */
  --ground:#F8FAFC; --surface:#FFFFFF; --surface-2:#F1F5F9; --surface-3:#F8FAFC;
  --ink:#0F172A; --ink-2:#334155; --muted:#64748B;
  --line:#E2E8F0; --line-2:#CBD5E1;
  --accent:#155EEF; --accent-2:#2563EB; --accent-soft:#E7EEFE; --accent-ink:#0B3FA8;
  --action:#FF7A00; --action-2:#E86E00; --action-soft:#FFF1E2; --action-ink:#9A4E00;
  --ok:#16A34A; --ok-soft:#DCFCE7;
  --warn:#9A4E00; --warn-soft:#FFF1E2;
  --crit:#DC2626; --crit-soft:#FEE2E2;
  --shadow-1:0 1px 2px rgba(15,23,42,.06);
  --shadow-2:0 1px 3px rgba(15,23,42,.07), 0 12px 28px -16px rgba(15,23,42,.24);
  --rail-w:238px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0B1220; --surface:#111A2B; --surface-2:#1B2436; --surface-3:#151E2E;
    --ink:#E8EEF7; --ink-2:#B8C4D4; --muted:#8496AC;
    --line:#26324A; --line-2:#3A4A66;
    --accent:#5B8DEF; --accent-2:#84AAF5; --accent-soft:#13254A; --accent-ink:#A9C6FA;
    --action:#FF9838; --action-2:#FFAC5E; --action-soft:#3A2410; --action-ink:#FFB670;
    --ok:#4ADE80; --ok-soft:#0F2E1F;
    --warn:#FFB670; --warn-soft:#3A2410;
    --crit:#F87171; --crit-soft:#3B1516;
    --shadow-1:0 1px 2px rgba(0,0,0,.4);
    --shadow-2:0 1px 3px rgba(0,0,0,.3), 0 12px 28px -16px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --ground:#0B1220; --surface:#111A2B; --surface-2:#1B2436; --surface-3:#151E2E;
  --ink:#E8EEF7; --ink-2:#B8C4D4; --muted:#8496AC;
  --line:#26324A; --line-2:#3A4A66;
  --accent:#5B8DEF; --accent-2:#84AAF5; --accent-soft:#13254A; --accent-ink:#A9C6FA;
  --action:#FF9838; --action-2:#FFAC5E; --action-soft:#3A2410; --action-ink:#FFB670;
  --ok:#4ADE80; --ok-soft:#0F2E1F;
  --warn:#FFB670; --warn-soft:#3A2410;
  --crit:#F87171; --crit-soft:#3B1516;
  --shadow-1:0 1px 2px rgba(0,0,0,.4);
  --shadow-2:0 1px 3px rgba(0,0,0,.3), 0 12px 28px -16px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0; background:var(--ground); color:var(--ink);
  font-family:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif; font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:Archivo,"Helvetica Neue",Arial,sans-serif; margin:0; text-wrap:balance; letter-spacing:-.01em}
p{margin:0}
button{font:inherit; color:inherit; cursor:pointer; border:0; background:none}
:focus-visible{outline:2px solid var(--accent-2); outline-offset:2px; border-radius:3px}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace; font-variant-numeric:tabular-nums}
.eyebrow{font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:10.5px; font-weight:500;
  letter-spacing:.12em; text-transform:uppercase; color:var(--muted)}

/* Login */
.login{min-height:100%; display:flex; align-items:center; justify-content:center;
  padding:16px; padding-block:56px}
.login-card{width:100%; max-width:560px}
.login-brand{display:flex; align-items:center; gap:14px; margin-bottom:22px}
.login-logo{width:52px; height:52px; border-radius:13px; background:var(--accent); color:#fff;
  display:flex; align-items:center; justify-content:center; flex:none}
:root[data-theme="dark"] .login-logo{color:#0B1220}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .login-logo{color:#0B1220}}
.login-logo svg{width:26px; height:26px}
.login-brand-t{display:flex; flex-direction:column; gap:3px; min-width:0}
.login-brand-t h1{font-size:30px; font-weight:700; line-height:1.05; letter-spacing:-.02em}
.login-sub{color:var(--ink-2); font-size:14.5px; margin-bottom:24px; max-width:48ch}
.login-sub b{font-weight:600; color:var(--ink)}

.roles{display:flex; flex-direction:column; gap:10px}
.role{display:flex; align-items:center; gap:14px; text-align:left; width:100%;
  background:var(--surface); border:1px solid var(--line); border-radius:11px;
  padding:15px 16px; cursor:pointer;
  transition:border-color .14s, box-shadow .14s, background .14s}
.role:hover{border-color:var(--line-2); box-shadow:var(--shadow-1)}
.role-icon{width:42px; height:42px; border-radius:11px; background:var(--surface-2);
  color:var(--ink-2); display:flex; align-items:center; justify-content:center; flex:none;
  transition:background .14s, color .14s}
.role-icon svg{width:19px; height:19px}
.role-txt{display:flex; flex-direction:column; gap:2px; flex:1; min-width:0}
.role-who{font-family:Archivo; font-weight:600; font-size:16.5px; letter-spacing:-.01em}
.role-rol{font-size:13px; color:var(--ink-2)}
.role-mail{font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--muted);
  margin-top:3px; word-break:break-all}
.role-chev{color:var(--line-2); flex:none; display:flex; transition:color .14s, transform .14s}
.role-chev svg{width:17px; height:17px}
.role:hover .role-chev{color:var(--muted); transform:translateX(2px)}
.role.is-picked{border-color:var(--accent); background:var(--accent-soft); box-shadow:var(--shadow-1)}
.role.is-picked .role-icon{background:var(--accent); color:#fff}
:root[data-theme="dark"] .role.is-picked .role-icon{color:#0B1220}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .role.is-picked .role-icon{color:#0B1220}}
.role.is-picked .role-chev{color:var(--accent); transform:translateX(2px)}

.login-go{display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-top:20px;
  padding-top:18px; border-top:1px solid var(--line)}
.login-pick{display:flex; flex-direction:column; gap:1px; flex:1; min-width:180px}
.login-pick b{font-family:Archivo; font-weight:600; font-size:14px}
.btn-enter{padding:11px 22px; font-size:13.5px; font-weight:600; flex:none; border-radius:8px}
@media (max-width:460px){
  .login-brand-t h1{font-size:25px}
  .login-go{flex-direction:column; align-items:stretch}
  .btn-enter{width:100%}
  .role{padding:13px 14px; gap:12px}
  .role-icon{width:38px; height:38px}
}

/* Shell */
.shell{display:grid; grid-template-columns:var(--rail-w) 1fr; min-height:100%}
@media (max-width:900px){.shell{grid-template-columns:1fr}}
.rail{background:var(--surface); border-right:1px solid var(--line); padding:20px 0 24px;
  position:sticky; align-self:start; top:env(safe-area-inset-top,0px); max-height:100vh; overflow-y:auto}
@media (max-width:900px){.rail{position:static; max-height:none; border-right:0;
  border-bottom:1px solid var(--line); padding:14px 0 10px}}
.rail-brand{padding:0 18px 18px; display:flex; align-items:baseline; gap:8px; flex-wrap:wrap}
.nav-group{padding:0 10px}
.nav-group .eyebrow{padding:0 8px 7px}
@media (max-width:900px){.nav-group{display:flex; gap:6px; overflow-x:auto; padding:0 12px 4px}
  .nav-group .eyebrow{display:none}}
.nav-item{display:flex; align-items:center; gap:9px; width:100%; text-align:left;
  padding:8px 8px 8px 11px; border-radius:4px; color:var(--ink-2); font-size:13.5px;
  border-left:2px solid transparent; white-space:nowrap}
.nav-item:hover{background:var(--surface-2); color:var(--ink)}
.nav-item[aria-current="true"]{background:var(--accent-soft); color:var(--accent-ink);
  font-weight:600; border-left-color:var(--accent)}
:root[data-theme="dark"] .nav-item[aria-current="true"]{color:var(--accent-2)}
.nav-count{margin-left:auto; font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--muted)}
.nav-item[aria-current="true"] .nav-count{color:inherit}
.nav-count.alert{background:var(--warn-soft); color:var(--warn); padding:1px 6px; border-radius:9px}
@media (max-width:900px){.nav-item{border-left:0; border-bottom:2px solid transparent;
  border-radius:4px 4px 0 0; width:auto}
  .nav-item[aria-current="true"]{border-left-color:transparent; border-bottom-color:var(--accent)}}
.main{min-width:0; display:flex; flex-direction:column}
.topbar{position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
  background:color-mix(in srgb, var(--ground) 88%, transparent); backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line); padding:11px 20px; display:flex; align-items:center;
  gap:14px; flex-wrap:wrap}
.who{display:flex; flex-direction:column; min-width:0}
.who b{font-family:Archivo; font-size:13.5px; font-weight:600}
.who span{font-size:11.5px; color:var(--muted)}
.topbar-actions{margin-left:auto; display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.btn{border:1px solid var(--line-2); background:var(--surface); border-radius:4px; padding:6px 11px;
  font-size:12.5px; color:var(--ink-2); transition:border-color .14s, background .14s}
.btn:hover{border-color:var(--accent); color:var(--ink)}
.btn-primary{background:var(--action); border-color:var(--action); color:#fff}
:root[data-theme="dark"] .btn-primary{color:#20140A}
.btn-primary:hover{background:var(--action-2); border-color:var(--action-2)}
.btn:disabled{opacity:.45; cursor:not-allowed}
.content{padding:24px 20px 56px; max-width:1180px; width:100%}
@media (max-width:520px){.topbar{padding:11px 16px} .content{padding:20px 16px 48px}}
.page-head{margin-bottom:20px; max-width:74ch}
.page-head h2{font-size:22px; font-weight:700; margin:5px 0 6px}
.page-head p{color:var(--ink-2); font-size:13.5px}

/* Tiles */
.tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(178px,1fr)); gap:1px;
  background:var(--line); border:1px solid var(--line); border-radius:5px; overflow:hidden; margin-bottom:22px}
.tile{background:var(--surface); padding:15px 16px 14px; display:flex; flex-direction:column; gap:5px}
.tile-k{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.09em;
  text-transform:uppercase; color:var(--muted)}
.tile-v{font-family:Archivo; font-weight:700; font-size:27px; line-height:1; font-variant-numeric:tabular-nums}
.tile-v small{font-size:14px; font-weight:600; color:var(--ink-2); margin-left:2px}
.tile-n{font-size:12px; color:var(--muted)}

/* Cards */
.card{background:var(--surface); border:1px solid var(--line); border-radius:5px;
  box-shadow:var(--shadow-1); margin-bottom:18px}
.card-head{padding:14px 16px; border-bottom:1px solid var(--line); display:flex;
  align-items:center; gap:12px; flex-wrap:wrap}
.card-head h3{font-size:14.5px; font-weight:600}
.card-head .spacer{margin-left:auto}
.card-body{padding:16px}
.card-note{padding:11px 16px; border-top:1px solid var(--line); font-size:12px;
  color:var(--muted); background:var(--surface-3)}

/* Badges */
.badge{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:500;
  padding:2px 8px; border-radius:3px; white-space:nowrap}
.badge .dot{width:6px; height:6px; border-radius:50%; background:currentColor; flex:none}
.b-ok{background:var(--ok-soft); color:var(--ok)}
.b-warn{background:var(--warn-soft); color:var(--warn)}
.b-crit{background:var(--crit-soft); color:var(--crit)}
.b-neutral{background:var(--surface-2); color:var(--ink-2)}
.b-accent{background:var(--accent-soft); color:var(--accent-ink)}
:root[data-theme="dark"] .b-accent{color:var(--accent-2)}

/* Tables */
.tw{overflow-x:auto; -webkit-overflow-scrolling:touch}
table{border-collapse:collapse; width:100%; min-width:580px; font-size:13px}
th{text-align:left; font-family:"IBM Plex Mono",monospace; font-size:10.5px; font-weight:500;
  letter-spacing:.09em; text-transform:uppercase; color:var(--muted); padding:9px 12px;
  border-bottom:1px solid var(--line); white-space:nowrap; background:var(--surface-3)}
td{padding:11px 12px; border-bottom:1px solid var(--line); vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tr.clickable{cursor:pointer}
tr.clickable:hover td{background:var(--surface-3)}
td.r,th.r{text-align:right}
.t-strong{font-weight:600}
.t-sub{font-size:11.5px; color:var(--muted)}
tr.excl td{background:var(--surface-3)}
tr.excl td:first-child{color:var(--muted)}
tr.pick td{background:var(--ok-soft)}

/* Meter */
.meter{height:5px; background:var(--surface-2); border-radius:3px; overflow:hidden; min-width:70px}
.meter i{display:block; height:100%; background:var(--accent); border-radius:3px; transition:width .5s ease}
.meter.is-full i{background:var(--ok)}
.meter.is-low i{background:var(--warn)}
.meter-row{display:flex; align-items:center; gap:9px}
.meter-row .mono{font-size:11.5px; color:var(--ink-2); flex:none}
.score-bar{height:6px; background:var(--surface-2); border-radius:3px; overflow:hidden; width:64px; display:inline-block; vertical-align:middle}
.score-bar i{display:block; height:100%; background:var(--accent); border-radius:3px}

/* Docs */
.docs{display:flex; flex-direction:column}
.doc{display:flex; align-items:center; gap:12px; padding:10px 16px; border-bottom:1px solid var(--line); font-size:13px}
.doc:last-child{border-bottom:0}
.doc-i{font-family:"IBM Plex Mono",monospace; font-size:9.5px; font-weight:500; letter-spacing:.04em;
  width:38px; flex:none; text-align:center; padding:3px 0; border-radius:3px;
  background:var(--surface-2); color:var(--muted)}
.doc-n{flex:1; min-width:0}
.doc-n b{font-weight:500; display:block}
.doc-sz{font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--ink-2); flex:none; font-variant-numeric:tabular-nums}
.doc.missing{background:var(--surface-3)}
.doc.missing .doc-n b{color:var(--muted)}
.doc-prog{width:78px; flex:none}

/* Timeline */
.hitos{list-style:none; margin:0; padding:0}
.hito{display:flex; gap:14px; padding-bottom:16px; position:relative}
.hito:last-child{padding-bottom:0}
.hito-rail{flex:none; width:12px; display:flex; flex-direction:column; align-items:center}
.hito-dot{width:11px; height:11px; border-radius:50%; border:2px solid var(--line-2);
  background:var(--surface); margin-top:4px; flex:none}
.hito-line{flex:1; width:2px; background:var(--line); margin:3px 0 -16px}
.hito:last-child .hito-line{display:none}
.hito.done .hito-dot{background:var(--ok); border-color:var(--ok)}
.hito.done .hito-line{background:var(--ok)}
.hito.now .hito-dot{background:var(--accent); border-color:var(--accent); box-shadow:0 0 0 4px var(--accent-soft)}
.hito-b b{font-weight:500; font-size:13.5px; display:block}
.hito-b span{font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--muted)}
.hito.next .hito-b b{color:var(--muted); font-weight:400}

/* Alert */
.alert{display:flex; gap:11px; padding:12px 14px; border-radius:4px; font-size:13px;
  background:var(--warn-soft); color:var(--warn);
  border:1px solid color-mix(in srgb,var(--warn) 26%, transparent); margin-bottom:16px; align-items:flex-start}
.alert b{display:block; font-weight:600; margin-bottom:2px}
.alert p{color:var(--ink-2)}
.alert .dot{width:7px; height:7px; border-radius:50%; background:currentColor; margin-top:6px; flex:none}
.alert.good{background:var(--ok-soft); color:var(--ok); border-color:color-mix(in srgb,var(--ok) 26%, transparent)}
.alert.info{background:var(--accent-soft); color:var(--accent-ink); border-color:color-mix(in srgb,var(--accent) 26%, transparent)}
:root[data-theme="dark"] .alert.info{color:var(--accent-2)}

/* Antes/ahora */
.ba-row{display:grid; grid-template-columns:1.6fr auto auto auto; gap:14px; align-items:center;
  padding:12px 16px; border-bottom:1px solid var(--line)}
.ba-row:last-child{border-bottom:0}
@media (max-width:620px){.ba-row{grid-template-columns:1fr auto; row-gap:6px}
  .ba-row .ba-l{grid-column:1/-1}}
.ba-l{font-size:13px; color:var(--ink-2)}
.ba-antes{font-family:"IBM Plex Mono",monospace; font-size:12.5px; color:var(--muted);
  text-decoration:line-through; font-variant-numeric:tabular-nums}
.ba-arrow{color:var(--line-2); font-size:12px}
.ba-ahora{font-family:Archivo; font-weight:600; font-size:15px; font-variant-numeric:tabular-nums; text-align:right}

/* kv */
.kv{display:flex; flex-direction:column; gap:2px}
.kv .eyebrow{font-size:10px}
.kv b{font-weight:500; font-size:13.5px}
.grid-kv{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:15px 18px}
.chips{display:flex; gap:6px; flex-wrap:wrap}

/* Reglas */
.rules{display:flex; flex-direction:column; gap:0}
.rule{display:flex; gap:11px; align-items:flex-start; padding:10px 16px; border-bottom:1px solid var(--line); font-size:13px}
.rule:last-child{border-bottom:0}
.rule-n{font-family:"IBM Plex Mono",monospace; font-size:10.5px; color:var(--accent-2);
  background:var(--accent-soft); border-radius:3px; padding:2px 6px; flex:none; margin-top:1px}
.rule b{font-weight:600; display:block; margin-bottom:1px}
.rule span{color:var(--ink-2); font-size:12.5px}

/* Filtros, formulario y cabecera con acción */
.page-head-row{display:flex; align-items:flex-start; gap:16px; flex-wrap:wrap; margin-bottom:4px}
.page-head-row .page-head{flex:1; min-width:240px}
.btn-lg{padding:10px 18px; font-size:13.5px; font-weight:600; border-radius:8px}
.chip{display:inline-flex; align-items:center; gap:7px; padding:6px 13px; border-radius:999px;
  border:1px solid var(--line-2); background:var(--surface); color:var(--ink-2);
  font-size:12.5px; transition:border-color .14s, background .14s, color .14s}
.chip:hover{border-color:var(--accent); color:var(--ink)}
.chip.is-on{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:500}
:root[data-theme="dark"] .chip.is-on{color:#0B1220}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip.is-on{color:#0B1220}}
.chip-n{font-family:"IBM Plex Mono",monospace; font-size:11px; opacity:.75}
.form-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(215px,1fr)); gap:14px}
.fld{display:flex; flex-direction:column; gap:5px}
.fld select,.fld input{padding:9px 11px; border:1px solid var(--line-2); border-radius:7px;
  background:var(--surface); color:var(--ink); font:inherit; width:100%}
.chk{display:flex; align-items:center; gap:9px; margin-top:16px; font-size:13px; color:var(--ink-2)}
.chk input{width:16px; height:16px; accent-color:var(--action); flex:none}

/* Sheet */
.sheet-bg{position:fixed; inset:0; background:rgba(9,17,20,.5); z-index:60}
.sheet{position:fixed; z-index:61; top:0; right:0; bottom:0; width:min(480px,100%);
  background:var(--surface); border-left:1px solid var(--line); box-shadow:var(--shadow-2);
  display:flex; flex-direction:column}
.sheet-head{padding:16px 18px; border-bottom:1px solid var(--line); display:flex;
  align-items:center; gap:12px; padding-top:calc(16px + env(safe-area-inset-top,0px))}
.sheet-head h3{font-size:15px; font-weight:600; flex:1}
.sheet-body{overflow-y:auto; padding:18px; padding-bottom:calc(32px + env(safe-area-inset-bottom,0px))}
.crit{border-bottom:1px solid var(--line); padding-bottom:14px; margin-bottom:14px}
.crit:last-child{border-bottom:0; margin-bottom:0; padding-bottom:0}
.crit-n{font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--accent-2); margin-bottom:3px}
.crit h4{font-size:13.5px; font-weight:600; margin-bottom:5px}
.crit p{font-size:12.5px; color:var(--ink-2); margin-bottom:6px}
.crit q{display:block; font-size:12.5px; color:var(--accent-ink); background:var(--accent-soft);
  padding:8px 10px; border-radius:3px; font-style:italic}
:root[data-theme="dark"] .crit q{color:var(--accent-2)}
ol.qs{margin:0; padding-left:20px; font-size:13px; color:var(--ink-2); display:flex; flex-direction:column; gap:7px}

.toast{position:fixed; left:50%; transform:translateX(-50%);
  bottom:calc(20px + env(safe-area-inset-bottom,0px)); z-index:80; background:var(--ink);

.nav-grp-t{font-family:"IBM Plex Mono",monospace; font-size:9.5px; letter-spacing:.13em;

  .nav-grp{display:inline-flex; gap:6px; padding:0 6px; margin:0}

  .nav-wrap{display:flex; overflow-x:auto; padding:0 10px 6px}
}

/* ===== Cabecera de página sin texto descriptivo ===== */
.ph{display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:18px}
.ph-t{display:flex; flex-direction:column; gap:2px; min-width:0}
.ph-t h2{font-size:21px; font-weight:700}
.ph-meta{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.ph-act{margin-left:auto; display:flex; gap:8px; flex-wrap:wrap}
.pill{display:inline-flex; align-items:center; gap:6px; font-family:"IBM Plex Mono",monospace;
  font-size:11px; color:var(--ink-2); background:var(--surface-2); border-radius:999px; padding:3px 10px}
.pill b{font-weight:600; color:var(--ink)}

/* ===== Pestañas ===== */
.tabs{display:flex; gap:2px; border-bottom:1px solid var(--line); margin-bottom:18px; overflow-x:auto}
.tab{padding:9px 14px; font-size:13px; color:var(--muted); white-space:nowrap;

.tab:hover{color:var(--ink)}
.tab.is-on{color:var(--accent); border-bottom-color:var(--accent); font-weight:600}

/* ===== Pipeline ===== */
.pipe{display:grid; grid-template-columns:repeat(5,1fr); gap:10px}

@media (max-width:520px){.pipe{grid-template-columns:1fr}}
.pipe-col{background:var(--surface); border:1px solid var(--line); border-radius:9px; overflow:hidden}
.pipe-h{padding:10px 12px; border-bottom:1px solid var(--line); background:var(--surface-3)}
.pipe-h b{display:block; font-family:Archivo; font-size:12.5px; font-weight:600}
.pipe-h span{font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--muted)}
.pipe-b{padding:8px; display:flex; flex-direction:column; gap:7px; min-height:60px}
.pcard{border:1px solid var(--line); border-radius:7px; padding:9px 10px; background:var(--surface);

.pcard:hover{border-color:var(--accent)}
.pcard b{display:block; font-size:12.5px; font-weight:600; margin-bottom:2px}
.pcard span{display:block; font-size:11px; color:var(--muted)}

.drop.is-over{border-color:var(--action); background:var(--action-soft)}
.drop-i{width:38px; height:38px; border-radius:10px; background:var(--surface-2); color:var(--ink-2);

.drop b{display:block; font-size:13.5px; font-weight:600; margin-bottom:3px}
.drop span{font-size:12px; color:var(--muted)}

function evaluar(t,d){
  var st=certEstado(t);
  if(st.code==="no"){
    var f=CERT_TIPOS.filter(function(c){return c.oblig&&t.certs[c.id].est!=="aprobado";})
      .map(function(c){return c.n.toLowerCase();});
    return {motivo:"Certificación no vigente: "+f.join(", "),regla:1};}
  if(st.code==="pend") return {motivo:"Validación de documentos pendiente",regla:1};
  if(t.certs.seguro.est==="aprobado"&&isoDe(t.certs.seguro.ven)<d.entregaISO)
    return {motivo:"Seguro vence el "+t.certs.seguro.ven+", antes de la entrega",regla:2};
  if(d.peligrosa&&t.certs.peligrosa.est!=="aprobado")
    return {motivo:"Sin certificación de carga peligrosa",regla:3};
  if(t.cobertura.indexOf(d.corredor)<0) return {motivo:"No cubre "+d.corredor,regla:4};
  if(t.cap*1000<d.peso) return {motivo:"Capacidad "+t.cap+" t < "+nf(d.peso)+" kg",regla:5};
  if(t.disp==="no_disponible") return {motivo:"No disponible en la fecha de carga",regla:6};
  return null;
}
var MESES={ene:"01",feb:"02",mar:"03",abr:"04",may:"05",jun:"06",jul:"07",ago:"08",sep:"09",oct:"10",nov:"11",dic:"12"};
function isoDe(f){
  var p=String(f).split(" ");
  if(p.length<3) return "2099-12-31";
  return p[2]+"-"+(MESES[p[1]]||"01")+"-"+("0"+p[0]).slice(-2);
}
function puntaje(t,d){
  var cumpl=(t.cumpl/100)*40;
  var rot=((12-Math.min(t.asignadas30d,12))/12)*30;
  var prox=(t.en===d.origen)?20:6;
  var disp=(t.disp==="disponible")?10:0;
  return {total:Math.round(cumpl+rot+prox+disp),cumpl:Math.round(cumpl),
          rot:Math.round(rot),prox:prox,disp:disp};
}
function candidatos(d){
  var ok=[],no=[];
  TRANSPORTISTAS.forEach(function(t){
    var r=evaluar(t,d);
    if(r) no.push({t:t,motivo:r.motivo,regla:r.regla}); else ok.push({t:t,p:puntaje(t,d)});});
  ok.sort(function(a,b){return b.p.total-a.p.total;});
  no.sort(function(a,b){return a.regla-b.regla;});
  return {ok:ok,no:no};
}

/* ===================== HELPERS DE UI ===================== */
function badge(c,t){return '<span class="badge '+c+'"><span class="dot"></span>'+t+'</span>';}
function bd(pair){return badge(pair[0],pair[1]);}
function pill(l,v){return '<span class="pill">'+l+' <b>'+v+'</b></span>';}
function ph(o){
  return '<div class="ph"><div class="ph-t">'
    +(o.eyebrow?'<span class="eyebrow">'+o.eyebrow+'</span>':'')
    +'<h2>'+o.t+'</h2></div>'
    +(o.meta?'<div class="ph-meta">'+o.meta+'</div>':'')
    +(o.act?'<div class="ph-act">'+o.act+'</div>':'')+'</div>';
}
function tiles(a){return '<div class="tiles">'+a.map(function(t){
  return '<div class="tile"><span class="tile-k">'+t.k+'</span><span class="tile-v">'+t.v
    +(t.u?'<small>'+t.u+'</small>':'')+'</span>'+(t.n?'<span class="tile-n">'+t.n+'</span>':'')+'</div>';
}).join("")+'</div>';}
function card(title,body,act,note){
  return '<div class="card"><div class="card-head"><h3>'+title+'</h3>'
    +(act?'<span class="spacer"></span>'+act:'')+'</div>'+body
    +(note?'<div class="card-note">'+note+'</div>':'')+'</div>';
}
function tbl(cols,rows){
  return '<div class="tw"><table><thead><tr>'
    +cols.map(function(c){return '<th'+(c.r?' class="r"':'')+'>'+c.t+'</th>';}).join("")
    +'</tr></thead><tbody>'+(rows||'')+'</tbody></table></div>';
}
function meter(p,cls){
  return '<div class="meter-row"><div class="meter'+(cls||"")+'"><i style="width:'+p+'%"></i></div>'
    +'<span class="mono">'+p+'%</span></div>';
}
function alerta(t,d,cls){
  return '<div class="alert '+(cls||"")+'"><span class="dot"></span><div><b>'+t+'</b>'
    +(d?'<p>'+d+'</p>':'')+'</div></div>';
}
function emptyRow(n,msg){return '<tr><td colspan="'+n+'" class="t-sub" style="padding:22px;text-align:center">'+msg+'</td></tr>';}

var toastT=null;
function toast(m){
  var o=document.querySelector(".toast"); if(o) o.remove();
  var d=document.createElement("div"); d.className="toast"; d.textContent=m;
  document.body.appendChild(d);
  if(toastT) clearTimeout(toastT);
  toastT=setTimeout(function(){if(d.parentNode)d.remove();},4200);
}

/* ===================== LOGIN ===================== */
var pend=null;
function renderLogin(){
  $("roles").innerHTML=ROLES.map(function(r){
    return '<button class="role" type="button" role="radio" aria-checked="false" data-role="'+r.id+'">'
      +'<span class="role-icon" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" '
      +'stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">'+r.icon+'</svg></span>'
      +'<span class="role-txt"><span class="role-who">'+r.name+'</span>'
      +'<span class="role-rol">'+r.rol+'</span><span class="role-mail">'+r.mail+'</span></span>'
      +'<span class="role-chev" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" '
      +'stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5 10.5 8 6 12.5"/></svg></span>'
    +'</button>';}).join("");
  Array.prototype.forEach.call($("roles").querySelectorAll(".role"),function(b){
    b.addEventListener("click",function(){pickRole(b.getAttribute("data-role"));});
    b.addEventListener("dblclick",function(){pickRole(b.getAttribute("data-role"));enter(pend);});});
  $("btn-enter").addEventListener("click",function(){if(pend)enter(pend);});
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape"&&S.modal){closeModal();return;}
    if($("login").hidden)return;
    if(e.key==="Enter"&&pend){e.preventDefault();enter(pend);}});
  resetPick();
}
function resetPick(){
  pend=null;
  Array.prototype.forEach.call($("roles").querySelectorAll(".role"),function(b){
    b.classList.remove("is-picked");b.setAttribute("aria-checked","false");});
  $("login-pick").innerHTML='<span class="t-sub">Sin rol seleccionado</span>';
  $("btn-enter").disabled=true;$("btn-enter").textContent="Entrar";
}
function pickRole(id){
  var r=null;for(var i=0;i<ROLES.length;i++){if(ROLES[i].id===id)r=ROLES[i];}
  if(!r)return;
  pend=id;
  Array.prototype.forEach.call($("roles").querySelectorAll(".role"),function(b){
    var on=b.getAttribute("data-role")===id;
    b.classList.toggle("is-picked",on);b.setAttribute("aria-checked",on?"true":"false");});
  $("login-pick").innerHTML='<b>'+r.name+'</b><span class="t-sub">'+r.entidad+'</span>';
  $("btn-enter").disabled=false;$("btn-enter").textContent="Entrar";
}
function enter(id){
  for(var i=0;i<ROLES.length;i++){if(ROLES[i].id===id)S.role=ROLES[i];}
  if(!S.role)return;
  S.mod=S.role.mods[0];S.cliOpen=null;S.demOpen=null;S.viaOpen=null;S.traOpen=null;
  $("login").hidden=true;$("app").hidden=false;
  $("who-name").textContent=S.role.name;$("who-rol").textContent=S.role.entidad;
  renderNav();render();window.scrollTo(0,0);
}
function leave(){S.role=null;$("app").hidden=true;$("login").hidden=false;resetPick();window.scrollTo(0,0);}

function renderNav(){
  var pendCerts=TRANSPORTISTAS.reduce(function(a,t){
    return a+CERT_TIPOS.filter(function(c){return t.certs[c.id].est==="pendiente";}).length;},0);
  var cnt={clientes:CLIENTES.length,pipeline:OPORTUNIDADES.length,
    actividades:ACTIVIDADES.filter(function(a){return a.estado==="pendiente";}).length,
    documentos:visibleDocs().length,operaciones:visibleOps().length,
    demandas:DEMANDAS.length,viajes:visibleViajes().length,
    directorio:TRANSPORTISTAS.length,certificaciones:pendCerts};
  var html="";
  GRUPOS.forEach(function(g){
    var items=g.items.filter(function(m){return S.role.mods.indexOf(m)>=0;});
    if(!items.length)return;
    html+='<div class="nav-grp"><div class="nav-grp-t">'+g.t+'</div>'
      +items.map(function(m){
        var c=cnt[m]!=null?'<span class="nav-count'+(m==="certificaciones"&&cnt[m]>0?" alert":"")+'">'+cnt[m]+'</span>':'';
        return '<button class="nav-item" data-mod="'+m+'" aria-current="'+(S.mod===m)+'">'+MODS[m]+c+'</button>';
      }).join("")+'</div>';});
  $("nav").innerHTML=html;
  Array.prototype.forEach.call($("nav").querySelectorAll(".nav-item"),function(b){
    b.addEventListener("click",function(){go(b.getAttribute("data-mod"));});});
}
function go(m){
  S.mod=m;S.cliOpen=null;S.demOpen=null;S.viaOpen=null;S.traOpen=null;
  S.docPage=1;S.q="";
  renderNav();render();window.scrollTo(0,0);
}

var PAGE=20;

function docFiltrados(cli){
  var base=cli?docsDe(cli):visibleDocs();
  var q=S.docQ.toLowerCase();
  return base.filter(function(d){
    if(S.docCat!=="todas"&&d.cat!==S.docCat) return false;
    if(S.docEstado!=="todos"&&d.estado!==S.docEstado) return false;
    if(S.docOp!=="todas"&&d.op!==S.docOp) return false;
    if(q.length>=2&&(d.n+" "+d.op+" "+catN(d.cat).n).toLowerCase().indexOf(q)<0) return false;
    return true;});
}

function docPanel(cli){
  var base=cli?docsDe(cli):visibleDocs();
  var lista=docFiltrados(cli);
  var totalMB=base.reduce(function(a,d){return a+d.size;},0);
  var dups=base.filter(function(d){return d.dup;}).length;
  var pend=base.filter(function(d){return d.estado==="pendiente";}).length;
  var pages=Math.max(1,Math.ceil(lista.length/PAGE));
  if(S.docPage>pages) S.docPage=pages;
  var slice=lista.slice((S.docPage-1)*PAGE,S.docPage*PAGE);

  /* Carpetas por categoría */
  var folders='<button class="tnode'+(S.docCat==="todas"?" is-on":"")+'" data-doccat="todas">'
    +'<span class="tnode-n">Todas las categorías</span><span class="tnode-c">'+base.length+'</span></button>'
    +DOC_CATS.map(function(c){
      var n=base.filter(function(d){return d.cat===c.id;}).length;
      if(!n) return "";
      return '<button class="tnode'+(S.docCat===c.id?" is-on":"")+'" data-doccat="'+c.id+'">'
        +'<span class="tnode-n">'+c.n+'</span><span class="tnode-c">'+n+'</span></button>';}).join("");

  /* Filtros */
  var opsCli=(cli?OPERACIONES.filter(function(o){return o.cli===cli;}):visibleOps());
  var selOp='<select id="f-docop"><option value="todas">Todas las operaciones</option>'
    +opsCli.map(function(o){return '<option value="'+o.id+'"'+(S.docOp===o.id?" selected":"")+'>'+o.id+'</option>';}).join("")
    +'</select>';
  var selEst='<select id="f-docest"><option value="todos">Todos los estados</option>'
    +Object.keys(DOC_ESTADOS).map(function(k){
      return '<option value="'+k+'"'+(S.docEstado===k?" selected":"")+'>'+DOC_ESTADOS[k][1]+'</option>';}).join("")
    +'</select>';

  var rows=slice.map(function(d){
    var e=DOC_ESTADOS[d.estado];
    return '<tr class="clickable" data-doc="'+d.id+'">'
      +'<td><span class="doc-i">'+d.fmt+'</span></td>'
      +'<td class="t-strong fname" title="'+esc(d.n)+'">'+d.n
        +(d.dup?' '+badge("b-warn","Duplicado"):'')+'</td>'
      +'<td class="t-sub">'+catN(d.cat).n+'</td>'
      +'<td class="mono t-sub">'+d.op+'</td>'
      +'<td class="r mono">'+mb(d.size)+'</td>'
      +'<td>'+bd(e)+'</td>'
      +'<td class="mono t-sub">'+d.fecha+'</td></tr>';}).join("");

  var pg='<div class="pg"><span>'+(lista.length?((S.docPage-1)*PAGE+1)+'–'+Math.min(S.docPage*PAGE,lista.length):0)
    +' de '+lista.length+'</span><div class="pg-b">'
    +'<button class="pg-btn" data-pg="'+(S.docPage-1)+'"'+(S.docPage<=1?" disabled":"")+'>‹</button>'
    +Array.apply(null,{length:Math.min(pages,7)}).map(function(_,i){
        var n=i+1;
        return '<button class="pg-btn'+(n===S.docPage?" is-on":"")+'" data-pg="'+n+'">'+n+'</button>';}).join("")
    +(pages>7?'<span style="padding:0 4px">…</span>':'')
    +'<button class="pg-btn" data-pg="'+(S.docPage+1)+'"'+(S.docPage>=pages?" disabled":"")+'>›</button>'
    +'</div></div>';

  return tiles([
      {k:"Archivos",v:nf(base.length),n:mb(totalMB)},
      {k:"Pendientes",v:String(pend),n:"Por revisar"},
      {k:"Duplicados",v:String(dups),n:"Detectados"},
      {k:"Operaciones",v:String(opsCli.length),n:"Con documentos"}])
    + '<div class="doc-layout">'
    + '<div class="card" style="margin:0"><div class="card-head"><h3>Categorías</h3></div>'
      + '<div class="tree">'+folders+'</div></div>'
    + '<div style="min-width:0">'
      + '<div class="card"><div class="card-body" style="padding-bottom:12px">'
      + '<div class="filter-row">'
      + '<input id="f-docq" type="search" value="'+esc(S.docQ)+'" placeholder="Buscar archivo…">'
      + selOp + selEst
      + '<button class="btn btn-primary" data-subir="'+(cli||"")+'">+ Subir archivos</button>'
      + '</div></div>'
      + tbl([{t:""},{t:"Archivo"},{t:"Categoría"},{t:"Operación"},{t:"Tamaño",r:true},{t:"Estado"},{t:"Fecha"}],
          rows||emptyRow(7,"Sin resultados"))
      + pg + '</div>'
    + '</div></div>';
}

function wireModal(){
  var drop=$("drop");
  if(drop){
    ["dragenter","dragover"].forEach(function(ev){
      drop.addEventListener(ev,function(e){e.preventDefault();drop.classList.add("is-over");});});
    ["dragleave","drop"].forEach(function(ev){
      drop.addEventListener(ev,function(e){e.preventDefault();drop.classList.remove("is-over");});});
    drop.addEventListener("drop",function(e){
      e.preventDefault();
      var f=e.dataTransfer&&e.dataTransfer.files;
      if(f&&f.length) listarArchivos(Array.prototype.slice.call(f));});
  }
  var inp=$("f-files");
  if(inp) inp.addEventListener("change",function(){
    listarArchivos(Array.prototype.slice.call(inp.files));});
  var c=$("m-cancel"); if(c) c.addEventListener("click",closeModal);
  var u=$("m-up"); if(u) u.addEventListener("click",function(){subirArchivos(u.getAttribute("data-cli"));});
}
var pendientesSubida=[];
function listarArchivos(files){
  pendientesSubida=files.map(function(f){
    return {n:f.name,size:Math.round((f.size/1048576)*10)/10||0.4};});
  $("up-list").innerHTML='<div class="eyebrow" style="margin-bottom:8px">'+files.length+' archivo(s)</div>'
    +'<div class="docs" style="border:1px solid var(--line);border-radius:8px">'
    +pendientesSubida.map(function(f){
      return '<div class="doc"><span class="doc-n"><b>'+esc(f.n)+'</b></span>'
        +'<span class="doc-sz">'+mb(f.size)+'</span></div>';}).join("")+'</div>';
}
function subirArchivos(cli){
  var op=$("f-upop")?$("f-upop").value:"";
  var cat=$("f-upcat")?$("f-upcat").value:"factura";
  var lote=pendientesSubida.length?pendientesSubida
    :[{n:"documento_"+Date.now()+".pdf",size:2.4},{n:"anexo_"+Date.now()+".pdf",size:5.1}];
  var nuevos=0,dups=0;
  lote.forEach(function(f){
    var existe=DOCS.some(function(d){return d.op===op&&d.n===f.n;});
    DOCS.push({id:"D"+(9000+DOCS.length),cli:cli,op:op,cat:cat,fmt:catN(cat).fmt,
      n:f.n,size:f.size,estado:"pendiente",fecha:"22 sep 2026",por:S.role.name,dup:existe});
    if(existe) dups++; else nuevos++;});
  pendientesSubida=[];
  closeModal();
  S.docPage=1;
  renderNav();render();
  toast(nuevos+" archivo(s) cargado(s) en "+op+(dups?" · "+dups+" duplicado(s) marcado(s)":""));
}

  if(!d)return;
  var c=cliBy(d.cli);
  openModal(d.n,
    '<div class="fprev">'+d.fmt+' · '+mb(d.size)+'</div>'

/* ===================== REPORTES ===================== */
function vReportes(){
  var pct=Math.round(PERF.aTiempo/PERF.total*100);
  var valor=OPORTUNIDADES.reduce(function(a,o){return a+o.valor;},0);
  var porEtapa=ETAPAS.map(function(e){
    return {n:e.n,c:CLIENTES.filter(function(c){return c.etapa===e.id;}).length};});
  var maxC=Math.max.apply(null,porEtapa.map(function(e){return e.c;}))||1;
  return ph({eyebrow:"Análisis",t:"Reportes",meta:pill("Periodo",PERF.periodo)})
    + tiles([
      {k:"Entregas a tiempo",v:String(pct),u:"%",n:PERF.aTiempo+" de "+PERF.total},
      {k:"Tardías",v:String(PERF.tarde),n:"Fuera de fecha"},
      {k:"Incidencias",v:String(PERF.incidencias),n:"Frontera o aduana"},
      {k:"Tránsito medio",v:String(PERF.horas),u:" h",n:"Puerta a puerta"},
      {k:"Pipeline",v:"USD "+nf(Math.round(valor/1000))+"k",n:OPORTUNIDADES.length+" oportunidades"},
      {k:"Documentos",v:nf(DOCS.length),n:mb(DOCS.reduce(function(a,d){return a+d.size;},0))}])
    + '<div class="grid2">'
    + card("Puntualidad por corredor",
        tbl([{t:"Corredor"},{t:"Envíos",r:true},{t:"Puntualidad"},{t:"Tránsito",r:true},{t:"Incid.",r:true}],
          PERF.corredores.map(function(c){
            return '<tr><td class="t-strong">'+c.n+'</td><td class="r mono">'+c.envios+'</td>'
              +'<td>'+meter(c.puntual,c.puntual>=94?" is-full":(c.puntual<90?" is-low":""))+'</td>'
              +'<td class="r mono">'+c.horas+' h</td><td class="r mono">'+c.incid+'</td></tr>';}).join("")))
    + card("Clientes por etapa",
        tbl([{t:"Etapa"},{t:"Clientes"},{t:"",r:true}],
          porEtapa.map(function(e){
            return '<tr><td class="t-strong">'+e.n+'</td>'
              +'<td>'+meter(Math.round(e.c/maxC*100))+'</td>'
              +'<td class="r mono">'+e.c+'</td></tr>';}).join("")))
    + '</div>'
    + card("Volumen documental por cliente",
        tbl([{t:"Cliente"},{t:"Archivos",r:true},{t:"Volumen",r:true},{t:"Pendientes",r:true},{t:"Operaciones",r:true}],
          CLIENTES.filter(function(c){return docsDe(c.id).length;})
            .sort(function(a,b){return docsDe(b.id).length-docsDe(a.id).length;})
            .map(function(c){
              var d=docsDe(c.id);
              return '<tr class="clickable" data-cli="'+c.id+'"><td class="t-strong">'+c.n+'</td>'
                +'<td class="r mono">'+nf(d.length)+'</td>'
                +'<td class="r mono">'+mb(d.reduce(function(a,x){return a+x.size;},0))+'</td>'
                +'<td class="r mono">'+d.filter(function(x){return x.estado==="pendiente";}).length+'</td>'
                +'<td class="r mono">'+OPERACIONES.filter(function(o){return o.cli===c.id;}).length+'</td></tr>';}).join("")));
}

/* ===================== ROUTER ===================== */
function render(){
  var h="";
  switch(S.mod){
    case "dashboard": h=vDashboard(); break;
    case "clientes": h=vClientes(); break;
    case "pipeline": h=vPipeline(); break;
    case "actividades": h=vActividades(); break;
    case "documentos": h=vDocumentos(); break;
    case "operaciones": h=vOperaciones(); break;
    case "demandas": h=vDemandas(); break;
    case "viajes": h=vViajes(); break;
    case "directorio": h=vDirectorio(); break;
    case "certificaciones": h=vCertificaciones(); break;
    case "reportes": h=vReportes(); break;
  }
  $("content").innerHTML=h;
  wire();
}
function wire(){
  var root=$("content");
  function on(sel,fn){Array.prototype.forEach.call(root.querySelectorAll(sel),function(el){
    el.addEventListener("click",function(e){e.stopPropagation();fn(el);});});}

  on("[data-mod]",function(el){go(el.getAttribute("data-mod"));});
  on("[data-go]",function(el){go(el.getAttribute("data-go"));});
  on("[data-back]",function(el){go(el.getAttribute("data-back"));});
  on("[data-cli]",function(el){
    S.cliOpen=el.getAttribute("data-cli");S.cliTab="resumen";S.mod="clientes";
    S.docCat="todas";S.docEstado="todos";S.docOp="todas";S.docQ="";S.docPage=1;
    renderNav();render();window.scrollTo(0,0);});
  on("[data-clitab]",function(el){S.cliTab=el.getAttribute("data-clitab");
    S.docPage=1;render();window.scrollTo(0,0);});
  on("[data-op]",function(el){
    var o=opBy(el.getAttribute("data-op"));
    if(!o)return;
    S.cliOpen=o.cli;S.cliTab="documentos";S.mod="clientes";
    S.docOp=o.id;S.docCat="todas";S.docEstado="todos";S.docQ="";S.docPage=1;
    renderNav();render();window.scrollTo(0,0);});
  on("[data-dem]",function(el){S.demOpen=el.getAttribute("data-dem");S.mod="demandas";
    renderNav();render();window.scrollTo(0,0);});
  on("[data-via]",function(el){S.viaOpen=el.getAttribute("data-via");S.mod="viajes";
    renderNav();render();window.scrollTo(0,0);});
  on("[data-tra]",function(el){S.traOpen=el.getAttribute("data-tra");S.mod="directorio";
    renderNav();render();window.scrollTo(0,0);});
  on("[data-filtro]",function(el){S.filtro=el.getAttribute("data-filtro");S.docPage=1;render();});
  on("[data-doccat]",function(el){S.docCat=el.getAttribute("data-doccat");S.docPage=1;render();});
  on("[data-pg]",function(el){
    var n=parseInt(el.getAttribute("data-pg"),10);
    if(n>=1){S.docPage=n;render();}});
  on("[data-doc]",function(el){modalDoc(el.getAttribute("data-doc"));});
  on("[data-subir]",function(el){modalSubir(el.getAttribute("data-subir")||null);});
  on("[data-pub]",function(el){publicar(el.getAttribute("data-pub"));});
  on("[data-asig]",function(el){asignar(el.getAttribute("data-asig"));});
  on("[data-avanzar]",function(el){avanzar(el.getAttribute("data-avanzar"));});
  on("[data-act-ok]",function(el){
    var id=el.getAttribute("data-act-ok");
    ACTIVIDADES.forEach(function(a){if(a.id===id)a.estado="hecha";});
    renderNav();render();toast("Actividad marcada como hecha");});
  on("[data-cert-ok]",function(el){
    var p=el.getAttribute("data-cert-ok").split("|");aprobarCert(p[0],p[1]);});
  on("[data-cert-up]",function(el){
    var p=el.getAttribute("data-cert-up").split("|");subirCert(p[0],p[1]);});
  on("[data-crear-dem]",function(el){modalDemanda(el.getAttribute("data-crear-dem"));});

  var q=$("q");
  if(q) q.addEventListener("input",function(){S.q=q.value;render();
    var n=$("q");if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length);}});
  var dq=$("f-docq");
  if(dq) dq.addEventListener("input",function(){S.docQ=dq.value;S.docPage=1;render();
    var n=$("f-docq");if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length);}});
  var fo=$("f-docop");
  if(fo) fo.addEventListener("change",function(){S.docOp=fo.value;S.docPage=1;render();});
  var fe=$("f-docest");
  if(fe) fe.addEventListener("change",function(){S.docEstado=fe.value;S.docPage=1;render();});
  var bn=$("btn-nuevo-cli"); if(bn) bn.addEventListener("click",modalProspecto);
  var ba=$("btn-nueva-act"); if(ba) ba.addEventListener("click",modalActividad);
  var bd2=$("btn-nueva-dem"); if(bd2) bd2.addEventListener("click",function(){modalDemanda(null);});
  var bt=$("btn-nuevo-tra"); if(bt) bt.addEventListener("click",modalTransportista);
}

function publicar(id){
  var d=demBy(id); if(!d)return;

function asignar(id){
  var d=demBy(id); if(!d)return;
  var c=candidatos(d);
  if(!c.ok.length){toast("Ningún transportista cumple los requisitos");return;}
  var g=c.ok[0];
  d.tra=g.t.id; d.estado="asignada"; g.t.asignadas30d++;
  var nv={id:"VJ-"+(1182+VIAJES.length),dem:d.id,cli:d.cli,tra:g.t.id,
    origen:d.origen,destino:d.destino,estado:"asignado",pct:8,eta:d.entrega+" · 12:00",
    pos:"Pendiente de confirmación del transportista",inc:null,
    hitos:[{n:"Asignado",t:HOY,s:"done"},{n:"Confirmado por transportista",t:"pendiente",s:"now"},
      {n:"En carga",t:"ETA "+d.carga,s:"next"},{n:"En tránsito",t:"—",s:"next"},
      {n:"En reparto",t:"—",s:"next"},{n:"Entregado",t:"ETA "+d.entrega,s:"next"}],
    log:[{t:HOY,m:"Transportista asignado: "+g.t.n+" (puntaje "+g.p.total+")"}]};
  VIAJES.push(nv);
  S.mod="viajes"; S.viaOpen=nv.id; S.demOpen=null;
  renderNav();render();window.scrollTo(0,0);
  toast("Asignado a "+g.t.n+" · viaje "+nv.id+" creado");
}
var ORDEN=["pendiente","asignado","confirmado","carga","transito","reparto","entregado"];
function avanzar(id){
  var v=viaBy(id); if(!v)return;
  var cur=v.estado==="incidencia"?"transito":v.estado;
  var i=ORDEN.indexOf(cur);
  if(i<0||i>=ORDEN.length-1)return;
  var next=ORDEN[i+1];
  v.estado=next; v.inc=null;
  v.pct=Math.min(100,Math.round((i+2)/ORDEN.length*100));
  if(next==="entregado"){v.pct=100;v.entregado=HOY+" · 11:30";v.puntual=true;
    v.pos="Entregado en destino";
    var d=demBy(v.dem); if(d) d.estado="cerrada";}
  v.hitos.forEach(function(h,k){
    if(k<i+1) h.s="done"; else if(k===i+1) h.s="now"; else h.s="next";});
  if(next==="entregado") v.hitos.forEach(function(h){h.s="done";});
  v.log.unshift({t:HOY,m:"Estado actualizado a "+VIAJE_EST[next][1]});
  renderNav();render();
  toast("Viaje "+id+" → "+VIAJE_EST[next][1]);
}
function aprobarCert(tid,cid){
  var t=traBy(tid); if(!t)return;
  t.certs[cid].est="aprobado";
  var st=certEstado(t);
  renderNav();render();
  toast(st.code==="ok"?t.n+" quedó certificado":certN(cid)+" aprobada");
}
function subirCert(tid,cid){
  var t=traBy(tid); if(!t)return;
  t.certs[cid]={est:"pendiente",em:HOY,ven:"22 sep 2029"};
  renderNav();render();
  toast(certN(cid)+" enviada · pendiente de validación");
}
