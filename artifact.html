<title>DMS Puerto a Puerta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  /* Identidad: azul eléctrico #155EEF (principal) · naranja #FF7A00 (acción)
     verde #16A34A (éxito) · fondo #F8FAFC · texto #0F172A · bordes #E2E8F0 */
  --ground:#F8FAFC; --surface:#FFFFFF; --surface-2:#F1F5F9; --surface-3:#F8FAFC;
  --ink:#0F172A; --ink-2:#334155; --muted:#64748B;
  --line:#E2E8F0; --line-2:#CBD5E1;
  --accent:#155EEF; --accent-2:#2563EB; --accent-soft:#E7EEFE; --accent-ink:#0B3FA8;
  --action:#FF7A00; --action-2:#E86E00; --action-soft:#FFF1E2; --action-ink:#9A4E00;
  --ok:#16A34A; --ok-soft:#DCFCE7;
  --warn:#9A4E00; --warn-soft:#FFF1E2;
  --crit:#DC2626; --crit-soft:#FEE2E2;
  --shadow-1:0 1px 2px rgba(15,23,42,.06);
  --shadow-2:0 1px 3px rgba(15,23,42,.07), 0 12px 28px -16px rgba(15,23,42,.24);
  --rail-w:238px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0B1220; --surface:#111A2B; --surface-2:#1B2436; --surface-3:#151E2E;
    --ink:#E8EEF7; --ink-2:#B8C4D4; --muted:#8496AC;
    --line:#26324A; --line-2:#3A4A66;
    --accent:#5B8DEF; --accent-2:#84AAF5; --accent-soft:#13254A; --accent-ink:#A9C6FA;
    --action:#FF9838; --action-2:#FFAC5E; --action-soft:#3A2410; --action-ink:#FFB670;
    --ok:#4ADE80; --ok-soft:#0F2E1F;
    --warn:#FFB670; --warn-soft:#3A2410;
    --crit:#F87171; --crit-soft:#3B1516;
    --shadow-1:0 1px 2px rgba(0,0,0,.4);
    --shadow-2:0 1px 3px rgba(0,0,0,.3), 0 12px 28px -16px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --ground:#0B1220; --surface:#111A2B; --surface-2:#1B2436; --surface-3:#151E2E;
  --ink:#E8EEF7; --ink-2:#B8C4D4; --muted:#8496AC;
  --line:#26324A; --line-2:#3A4A66;
  --accent:#5B8DEF; --accent-2:#84AAF5; --accent-soft:#13254A; --accent-ink:#A9C6FA;
  --action:#FF9838; --action-2:#FFAC5E; --action-soft:#3A2410; --action-ink:#FFB670;
  --ok:#4ADE80; --ok-soft:#0F2E1F;
  --warn:#FFB670; --warn-soft:#3A2410;
  --crit:#F87171; --crit-soft:#3B1516;
  --shadow-1:0 1px 2px rgba(0,0,0,.4);
  --shadow-2:0 1px 3px rgba(0,0,0,.3), 0 12px 28px -16px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0; background:var(--ground); color:var(--ink);
  font-family:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif; font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:Archivo,"Helvetica Neue",Arial,sans-serif; margin:0; text-wrap:balance; letter-spacing:-.01em}
p{margin:0}
button{font:inherit; color:inherit; cursor:pointer; border:0; background:none}
:focus-visible{outline:2px solid var(--accent-2); outline-offset:2px; border-radius:3px}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace; font-variant-numeric:tabular-nums}
.eyebrow{font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:10.5px; font-weight:500;
  letter-spacing:.12em; text-transform:uppercase; color:var(--muted)}

/* Login */
.login{min-height:100%; display:flex; align-items:center; justify-content:center;
  padding:16px; padding-block:56px}
.login-card{width:100%; max-width:560px}
.login-brand{display:flex; align-items:center; gap:14px; margin-bottom:22px}
.login-logo{width:52px; height:52px; border-radius:13px; background:var(--accent); color:#fff;
  display:flex; align-items:center; justify-content:center; flex:none}
:root[data-theme="dark"] .login-logo{color:#0B1220}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .login-logo{color:#0B1220}}
.login-logo svg{width:26px; height:26px}
.login-brand-t{display:flex; flex-direction:column; gap:3px; min-width:0}
.login-brand-t h1{font-size:30px; font-weight:700; line-height:1.05; letter-spacing:-.02em}
.login-sub{color:var(--ink-2); font-size:14.5px; margin-bottom:24px; max-width:48ch}
.login-sub b{font-weight:600; color:var(--ink)}

.roles{display:flex; flex-direction:column; gap:10px}
.role{display:flex; align-items:center; gap:14px; text-align:left; width:100%;
  background:var(--surface); border:1px solid var(--line); border-radius:11px;
  padding:15px 16px; cursor:pointer;
  transition:border-color .14s, box-shadow .14s, background .14s}
.role:hover{border-color:var(--line-2); box-shadow:var(--shadow-1)}
.role-icon{width:42px; height:42px; border-radius:11px; background:var(--surface-2);
  color:var(--ink-2); display:flex; align-items:center; justify-content:center; flex:none;
  transition:background .14s, color .14s}
.role-icon svg{width:19px; height:19px}
.role-txt{display:flex; flex-direction:column; gap:2px; flex:1; min-width:0}
.role-who{font-family:Archivo; font-weight:600; font-size:16.5px; letter-spacing:-.01em}
.role-rol{font-size:13px; color:var(--ink-2)}
.role-mail{font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--muted);
  margin-top:3px; word-break:break-all}
.role-chev{color:var(--line-2); flex:none; display:flex; transition:color .14s, transform .14s}
.role-chev svg{width:17px; height:17px}
.role:hover .role-chev{color:var(--muted); transform:translateX(2px)}
.role.is-picked{border-color:var(--accent); background:var(--accent-soft); box-shadow:var(--shadow-1)}
.role.is-picked .role-icon{background:var(--accent); color:#fff}
:root[data-theme="dark"] .role.is-picked .role-icon{color:#0B1220}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .role.is-picked .role-icon{color:#0B1220}}
.role.is-picked .role-chev{color:var(--accent); transform:translateX(2px)}

.login-go{display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-top:20px;
  padding-top:18px; border-top:1px solid var(--line)}
.login-pick{display:flex; flex-direction:column; gap:1px; flex:1; min-width:180px}
.login-pick b{font-family:Archivo; font-weight:600; font-size:14px}
.btn-enter{padding:11px 22px; font-size:13.5px; font-weight:600; flex:none; border-radius:8px}
@media (max-width:460px){
  .login-brand-t h1{font-size:25px}
  .login-go{flex-direction:column; align-items:stretch}
  .btn-enter{width:100%}
  .role{padding:13px 14px; gap:12px}
  .role-icon{width:38px; height:38px}
}

/* Shell */
.shell{display:grid; grid-template-columns:var(--rail-w) 1fr; min-height:100%}
@media (max-width:900px){.shell{grid-template-columns:1fr}}
.rail{background:var(--surface); border-right:1px solid var(--line); padding:20px 0 24px;
  position:sticky; align-self:start; top:env(safe-area-inset-top,0px); max-height:100vh; overflow-y:auto}
@media (max-width:900px){.rail{position:static; max-height:none; border-right:0;
  border-bottom:1px solid var(--line); padding:14px 0 10px}}
.rail-brand{padding:0 18px 18px; display:flex; align-items:baseline; gap:8px; flex-wrap:wrap}
.nav-group{padding:0 10px}
.nav-group .eyebrow{padding:0 8px 7px}
@media (max-width:900px){.nav-group{display:flex; gap:6px; overflow-x:auto; padding:0 12px 4px}
  .nav-group .eyebrow{display:none}}
.nav-item{display:flex; align-items:center; gap:9px; width:100%; text-align:left;
  padding:8px 8px 8px 11px; border-radius:4px; color:var(--ink-2); font-size:13.5px;
  border-left:2px solid transparent; white-space:nowrap}
.nav-item:hover{background:var(--surface-2); color:var(--ink)}
.nav-item[aria-current="true"]{background:var(--accent-soft); color:var(--accent-ink);
  font-weight:600; border-left-color:var(--accent)}
:root[data-theme="dark"] .nav-item[aria-current="true"]{color:var(--accent-2)}
.nav-count{margin-left:auto; font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--muted)}
.nav-item[aria-current="true"] .nav-count{color:inherit}
.nav-count.alert{background:var(--warn-soft); color:var(--warn); padding:1px 6px; border-radius:9px}
@media (max-width:900px){.nav-item{border-left:0; border-bottom:2px solid transparent;
  border-radius:4px 4px 0 0; width:auto}
  .nav-item[aria-current="true"]{border-left-color:transparent; border-bottom-color:var(--accent)}}
.main{min-width:0; display:flex; flex-direction:column}
.topbar{position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
  background:color-mix(in srgb, var(--ground) 88%, transparent); backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line); padding:11px 20px; display:flex; align-items:center;
  gap:14px; flex-wrap:wrap}
.who{display:flex; flex-direction:column; min-width:0}
.who b{font-family:Archivo; font-size:13.5px; font-weight:600}
.who span{font-size:11.5px; color:var(--muted)}
.topbar-actions{margin-left:auto; display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.btn{border:1px solid var(--line-2); background:var(--surface); border-radius:4px; padding:6px 11px;
  font-size:12.5px; color:var(--ink-2); transition:border-color .14s, background .14s}
.btn:hover{border-color:var(--accent); color:var(--ink)}
.btn-primary{background:var(--action); border-color:var(--action); color:#fff}
:root[data-theme="dark"] .btn-primary{color:#20140A}
.btn-primary:hover{background:var(--action-2); border-color:var(--action-2)}
.btn:disabled{opacity:.45; cursor:not-allowed}
.content{padding:24px 20px 56px; max-width:1180px; width:100%}
@media (max-width:520px){.topbar{padding:11px 16px} .content{padding:20px 16px 48px}}
.page-head{margin-bottom:20px; max-width:74ch}
.page-head h2{font-size:22px; font-weight:700; margin:5px 0 6px}
.page-head p{color:var(--ink-2); font-size:13.5px}

/* Tiles */
.tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(178px,1fr)); gap:1px;
  background:var(--line); border:1px solid var(--line); border-radius:5px; overflow:hidden; margin-bottom:22px}
.tile{background:var(--surface); padding:15px 16px 14px; display:flex; flex-direction:column; gap:5px}
.tile-k{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.09em;
  text-transform:uppercase; color:var(--muted)}
.tile-v{font-family:Archivo; font-weight:700; font-size:27px; line-height:1; font-variant-numeric:tabular-nums}
.tile-v small{font-size:14px; font-weight:600; color:var(--ink-2); margin-left:2px}
.tile-n{font-size:12px; color:var(--muted)}

/* Cards */
.card{background:var(--surface); border:1px solid var(--line); border-radius:5px;
  box-shadow:var(--shadow-1); margin-bottom:18px}
.card-head{padding:14px 16px; border-bottom:1px solid var(--line); display:flex;
  align-items:center; gap:12px; flex-wrap:wrap}
.card-head h3{font-size:14.5px; font-weight:600}
.card-head .spacer{margin-left:auto}
.card-body{padding:16px}
.card-note{padding:11px 16px; border-top:1px solid var(--line); font-size:12px;
  color:var(--muted); background:var(--surface-3)}

/* Badges */
.badge{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:500;
  padding:2px 8px; border-radius:3px; white-space:nowrap}
.badge .dot{width:6px; height:6px; border-radius:50%; background:currentColor; flex:none}
.b-ok{background:var(--ok-soft); color:var(--ok)}
.b-warn{background:var(--warn-soft); color:var(--warn)}
.b-crit{background:var(--crit-soft); color:var(--crit)}
.b-neutral{background:var(--surface-2); color:var(--ink-2)}
.b-accent{background:var(--accent-soft); color:var(--accent-ink)}
:root[data-theme="dark"] .b-accent{color:var(--accent-2)}

/* Tables */
.tw{overflow-x:auto; -webkit-overflow-scrolling:touch}
table{border-collapse:collapse; width:100%; min-width:580px; font-size:13px}
th{text-align:left; font-family:"IBM Plex Mono",monospace; font-size:10.5px; font-weight:500;
  letter-spacing:.09em; text-transform:uppercase; color:var(--muted); padding:9px 12px;
  border-bottom:1px solid var(--line); white-space:nowrap; background:var(--surface-3)}
td{padding:11px 12px; border-bottom:1px solid var(--line); vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tr.clickable{cursor:pointer}
tr.clickable:hover td{background:var(--surface-3)}
td.r,th.r{text-align:right}
.t-strong{font-weight:600}
.t-sub{font-size:11.5px; color:var(--muted)}
tr.excl td{background:var(--surface-3)}
tr.excl td:first-child{color:var(--muted)}
tr.pick td{background:var(--ok-soft)}

/* Meter */
.meter{height:5px; background:var(--surface-2); border-radius:3px; overflow:hidden; min-width:70px}
.meter i{display:block; height:100%; background:var(--accent); border-radius:3px; transition:width .5s ease}
.meter.is-full i{background:var(--ok)}
.meter.is-low i{background:var(--warn)}
.meter-row{display:flex; align-items:center; gap:9px}
.meter-row .mono{font-size:11.5px; color:var(--ink-2); flex:none}
.score-bar{height:6px; background:var(--surface-2); border-radius:3px; overflow:hidden; width:64px; display:inline-block; vertical-align:middle}
.score-bar i{display:block; height:100%; background:var(--accent); border-radius:3px}

/* Docs */
.docs{display:flex; flex-direction:column}
.doc{display:flex; align-items:center; gap:12px; padding:10px 16px; border-bottom:1px solid var(--line); font-size:13px}
.doc:last-child{border-bottom:0}
.doc-i{font-family:"IBM Plex Mono",monospace; font-size:9.5px; font-weight:500; letter-spacing:.04em;
  width:38px; flex:none; text-align:center; padding:3px 0; border-radius:3px;
  background:var(--surface-2); color:var(--muted)}
.doc-n{flex:1; min-width:0}
.doc-n b{font-weight:500; display:block}
.doc-sz{font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--ink-2); flex:none; font-variant-numeric:tabular-nums}
.doc.missing{background:var(--surface-3)}
.doc.missing .doc-n b{color:var(--muted)}
.doc-prog{width:78px; flex:none}

/* Timeline */
.hitos{list-style:none; margin:0; padding:0}
.hito{display:flex; gap:14px; padding-bottom:16px; position:relative}
.hito:last-child{padding-bottom:0}
.hito-rail{flex:none; width:12px; display:flex; flex-direction:column; align-items:center}
.hito-dot{width:11px; height:11px; border-radius:50%; border:2px solid var(--line-2);
  background:var(--surface); margin-top:4px; flex:none}
.hito-line{flex:1; width:2px; background:var(--line); margin:3px 0 -16px}
.hito:last-child .hito-line{display:none}
.hito.done .hito-dot{background:var(--ok); border-color:var(--ok)}
.hito.done .hito-line{background:var(--ok)}
.hito.now .hito-dot{background:var(--accent); border-color:var(--accent); box-shadow:0 0 0 4px var(--accent-soft)}
.hito-b b{font-weight:500; font-size:13.5px; display:block}
.hito-b span{font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--muted)}
.hito.next .hito-b b{color:var(--muted); font-weight:400}

/* Alert */
.alert{display:flex; gap:11px; padding:12px 14px; border-radius:4px; font-size:13px;
  background:var(--warn-soft); color:var(--warn);
  border:1px solid color-mix(in srgb,var(--warn) 26%, transparent); margin-bottom:16px; align-items:flex-start}
.alert b{display:block; font-weight:600; margin-bottom:2px}
.alert p{color:var(--ink-2)}
.alert .dot{width:7px; height:7px; border-radius:50%; background:currentColor; margin-top:6px; flex:none}
.alert.good{background:var(--ok-soft); color:var(--ok); border-color:color-mix(in srgb,var(--ok) 26%, transparent)}
.alert.info{background:var(--accent-soft); color:var(--accent-ink); border-color:color-mix(in srgb,var(--accent) 26%, transparent)}
:root[data-theme="dark"] .alert.info{color:var(--accent-2)}

/* Antes/ahora */
.ba-row{display:grid; grid-template-columns:1.6fr auto auto auto; gap:14px; align-items:center;
  padding:12px 16px; border-bottom:1px solid var(--line)}
.ba-row:last-child{border-bottom:0}
@media (max-width:620px){.ba-row{grid-template-columns:1fr auto; row-gap:6px}
  .ba-row .ba-l{grid-column:1/-1}}
.ba-l{font-size:13px; color:var(--ink-2)}
.ba-antes{font-family:"IBM Plex Mono",monospace; font-size:12.5px; color:var(--muted);
  text-decoration:line-through; font-variant-numeric:tabular-nums}
.ba-arrow{color:var(--line-2); font-size:12px}
.ba-ahora{font-family:Archivo; font-weight:600; font-size:15px; font-variant-numeric:tabular-nums; text-align:right}

/* kv */
.kv{display:flex; flex-direction:column; gap:2px}
.kv .eyebrow{font-size:10px}
.kv b{font-weight:500; font-size:13.5px}
.grid-kv{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:15px 18px}
.chips{display:flex; gap:6px; flex-wrap:wrap}

/* Reglas */
.rules{display:flex; flex-direction:column; gap:0}
.rule{display:flex; gap:11px; align-items:flex-start; padding:10px 16px; border-bottom:1px solid var(--line); font-size:13px}
.rule:last-child{border-bottom:0}
.rule-n{font-family:"IBM Plex Mono",monospace; font-size:10.5px; color:var(--accent-2);
  background:var(--accent-soft); border-radius:3px; padding:2px 6px; flex:none; margin-top:1px}
.rule b{font-weight:600; display:block; margin-bottom:1px}
.rule span{color:var(--ink-2); font-size:12.5px}

/* Filtros, formulario y cabecera con acción */
.page-head-row{display:flex; align-items:flex-start; gap:16px; flex-wrap:wrap; margin-bottom:4px}
.page-head-row .page-head{flex:1; min-width:240px}
.btn-lg{padding:10px 18px; font-size:13.5px; font-weight:600; border-radius:8px}
.chip{display:inline-flex; align-items:center; gap:7px; padding:6px 13px; border-radius:999px;
  border:1px solid var(--line-2); background:var(--surface); color:var(--ink-2);
  font-size:12.5px; transition:border-color .14s, background .14s, color .14s}
.chip:hover{border-color:var(--accent); color:var(--ink)}
.chip.is-on{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:500}
:root[data-theme="dark"] .chip.is-on{color:#0B1220}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip.is-on{color:#0B1220}}
.chip-n{font-family:"IBM Plex Mono",monospace; font-size:11px; opacity:.75}
.form-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(215px,1fr)); gap:14px}
.fld{display:flex; flex-direction:column; gap:5px}
.fld select,.fld input{padding:9px 11px; border:1px solid var(--line-2); border-radius:7px;
  background:var(--surface); color:var(--ink); font:inherit; width:100%}
.chk{display:flex; align-items:center; gap:9px; margin-top:16px; font-size:13px; color:var(--ink-2)}
.chk input{width:16px; height:16px; accent-color:var(--action); flex:none}

/* Sheet */
.sheet-bg{position:fixed; inset:0; background:rgba(9,17,20,.5); z-index:60}
.sheet{position:fixed; z-index:61; top:0; right:0; bottom:0; width:min(480px,100%);
  background:var(--surface); border-left:1px solid var(--line); box-shadow:var(--shadow-2);
  display:flex; flex-direction:column}
.sheet-head{padding:16px 18px; border-bottom:1px solid var(--line); display:flex;
  align-items:center; gap:12px; padding-top:calc(16px + env(safe-area-inset-top,0px))}
.sheet-head h3{font-size:15px; font-weight:600; flex:1}
.sheet-body{overflow-y:auto; padding:18px; padding-bottom:calc(32px + env(safe-area-inset-bottom,0px))}
.crit{border-bottom:1px solid var(--line); padding-bottom:14px; margin-bottom:14px}
.crit:last-child{border-bottom:0; margin-bottom:0; padding-bottom:0}
.crit-n{font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--accent-2); margin-bottom:3px}
.crit h4{font-size:13.5px; font-weight:600; margin-bottom:5px}
.crit p{font-size:12.5px; color:var(--ink-2); margin-bottom:6px}
.crit q{display:block; font-size:12.5px; color:var(--accent-ink); background:var(--accent-soft);
  padding:8px 10px; border-radius:3px; font-style:italic}
:root[data-theme="dark"] .crit q{color:var(--accent-2)}
ol.qs{margin:0; padding-left:20px; font-size:13px; color:var(--ink-2); display:flex; flex-direction:column; gap:7px}

.toast{position:fixed; left:50%; transform:translateX(-50%);
  bottom:calc(20px + env(safe-area-inset-bottom,0px)); z-index:80; background:var(--ink);
  color:var(--ground); padding:10px 16px; border-radius:4px; font-size:13px;
  box-shadow:var(--shadow-2); max-width:min(460px,calc(100% - 32px)); text-align:center}
.demo-flag{font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.09em;
  text-transform:uppercase; background:var(--warn-soft); color:var(--warn); padding:3px 7px;
  border-radius:3px; white-space:nowrap}
.back{font-size:12.5px; color:var(--accent-2); display:inline-flex; gap:5px; align-items:center; margin-bottom:12px}
input[type="search"],input[type="text"]{padding:9px 12px; border:1px solid var(--line-2);
  border-radius:4px; background:var(--surface); color:var(--ink); font:inherit; width:100%}
@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}

/* ===== Sidebar agrupado ===== */
.nav-grp{padding:0 10px; margin-bottom:14px}
.nav-grp-t{font-family:"IBM Plex Mono",monospace; font-size:9.5px; letter-spacing:.13em;
  text-transform:uppercase; color:var(--muted); padding:0 10px 6px}
@media (max-width:900px){
  .rail{position:static; max-height:none; border-right:0; border-bottom:1px solid var(--line)}
  .nav-grp{display:inline-flex; gap:6px; padding:0 6px; margin:0}
  .nav-grp-t{display:none}
  .nav-wrap{display:flex; overflow-x:auto; padding:0 10px 6px}
}

/* ===== Cabecera de página sin texto descriptivo ===== */
.ph{display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:18px}
.ph-t{display:flex; flex-direction:column; gap:2px; min-width:0}
.ph-t h2{font-size:21px; font-weight:700}
.ph-meta{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.ph-act{margin-left:auto; display:flex; gap:8px; flex-wrap:wrap}
.pill{display:inline-flex; align-items:center; gap:6px; font-family:"IBM Plex Mono",monospace;
  font-size:11px; color:var(--ink-2); background:var(--surface-2); border-radius:999px; padding:3px 10px}
.pill b{font-weight:600; color:var(--ink)}

/* ===== Pestañas ===== */
.tabs{display:flex; gap:2px; border-bottom:1px solid var(--line); margin-bottom:18px; overflow-x:auto}
.tab{padding:9px 14px; font-size:13px; color:var(--muted); white-space:nowrap;
  border-bottom:2px solid transparent; margin-bottom:-1px}
.tab:hover{color:var(--ink)}
.tab.is-on{color:var(--accent); border-bottom-color:var(--accent); font-weight:600}

/* ===== Pipeline ===== */
.pipe{display:grid; grid-template-columns:repeat(5,1fr); gap:10px}
@media (max-width:980px){.pipe{grid-template-columns:repeat(2,1fr)}}
@media (max-width:520px){.pipe{grid-template-columns:1fr}}
.pipe-col{background:var(--surface); border:1px solid var(--line); border-radius:9px; overflow:hidden}
.pipe-h{padding:10px 12px; border-bottom:1px solid var(--line); background:var(--surface-3)}
.pipe-h b{display:block; font-family:Archivo; font-size:12.5px; font-weight:600}
.pipe-h span{font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--muted)}
.pipe-b{padding:8px; display:flex; flex-direction:column; gap:7px; min-height:60px}
.pcard{border:1px solid var(--line); border-radius:7px; padding:9px 10px; background:var(--surface);
  cursor:pointer; text-align:left; width:100%; transition:border-color .13s}
.pcard:hover{border-color:var(--accent)}
.pcard b{display:block; font-size:12.5px; font-weight:600; margin-bottom:2px}
.pcard span{display:block; font-size:11px; color:var(--muted)}
.pcard .val{font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--accent); margin-top:4px}

/* ===== Zona de carga ===== */
.drop{border:1.5px dashed var(--line-2); border-radius:10px; padding:26px 18px; text-align:center;
  background:var(--surface-3); transition:border-color .14s, background .14s}
.drop.is-over{border-color:var(--action); background:var(--action-soft)}
.drop-i{width:38px; height:38px; border-radius:10px; background:var(--surface-2); color:var(--ink-2);
  display:flex; align-items:center; justify-content:center; margin:0 auto 10px}
.drop b{display:block; font-size:13.5px; font-weight:600; margin-bottom:3px}
.drop span{font-size:12px; color:var(--muted)}

/* ===== Árbol de carpetas ===== */
.tree{display:flex; flex-direction:column}
.tnode{display:flex; align-items:center; gap:10px; padding:8px 12px; border-bottom:1px solid var(--line);
  font-size:13px; width:100%; text-align:left; cursor:pointer}
.tnode:last-child{border-bottom:0}
.tnode:hover{background:var(--surface-3)}
.tnode.is-on{background:var(--accent-soft); color:var(--accent-ink); font-weight:500}
:root[data-theme="dark"] .tnode.is-on{color:var(--accent-2)}
.tnode-n{flex:1; min-width:0}
.tnode-c{font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--muted)}

/* ===== Paginación ===== */
.pg{display:flex; align-items:center; gap:8px; padding:11px 16px; border-top:1px solid var(--line);
  flex-wrap:wrap; font-size:12.5px; color:var(--muted)}
.pg-b{margin-left:auto; display:flex; gap:5px}
.pg-btn{border:1px solid var(--line-2); background:var(--surface); border-radius:6px; padding:4px 10px;
  font-size:12.5px; color:var(--ink-2); min-width:32px}
.pg-btn:hover:not(:disabled){border-color:var(--accent); color:var(--ink)}
.pg-btn.is-on{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600}
:root[data-theme="dark"] .pg-btn.is-on{color:#0B1220}
.pg-btn:disabled{opacity:.4; cursor:not-allowed}

/* ===== Modal ===== */
.mbg{position:fixed; inset:0; background:rgba(15,23,42,.55); z-index:70; display:flex;
  align-items:center; justify-content:center; padding:16px}
.modal{background:var(--surface); border:1px solid var(--line); border-radius:12px;
  box-shadow:var(--shadow-2); width:100%; max-width:560px; max-height:86vh; display:flex; flex-direction:column}
.modal-h{padding:15px 18px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:12px}
.modal-h h3{font-size:15px; font-weight:600; flex:1}
.modal-b{padding:18px; overflow-y:auto}
.modal-f{padding:13px 18px; border-top:1px solid var(--line); display:flex; gap:8px; justify-content:flex-end}

/* ===== Barra apilada ===== */
.sbar{display:flex; height:8px; border-radius:4px; overflow:hidden; background:var(--surface-2); gap:2px}
.sbar i{display:block; height:100%}
.legend{display:flex; gap:14px; flex-wrap:wrap; margin-top:10px; font-size:12px; color:var(--ink-2)}
.legend i{width:9px; height:9px; border-radius:2px; display:inline-block; margin-right:5px}

/* ===== Vista previa de archivo ===== */
.fprev{background:var(--surface-2); border:1px solid var(--line); border-radius:8px;
  height:170px; display:flex; align-items:center; justify-content:center; color:var(--muted);
  font-family:"IBM Plex Mono",monospace; font-size:12px; margin-bottom:14px}
.kvlist{display:flex; flex-direction:column; gap:0}
.kvrow{display:flex; gap:12px; padding:8px 0; border-bottom:1px solid var(--line); font-size:13px}
.kvrow:last-child{border-bottom:0}
.kvrow span:first-child{color:var(--muted); min-width:120px}
.kvrow span:last-child{flex:1; text-align:right; font-weight:500}

/* ===== Layout de dos columnas ===== */
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:18px; align-items:start}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}
.grid2 .card{margin-bottom:0}

/* ===== Layout documental ===== */
.doc-layout{display:grid; grid-template-columns:230px 1fr; gap:18px; align-items:start}
@media (max-width:860px){.doc-layout{grid-template-columns:1fr}}
.filter-row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.filter-row input[type="search"]{flex:1; min-width:180px; max-width:300px; width:auto}
.filter-row select{padding:9px 11px; border:1px solid var(--line-2); border-radius:7px;
  background:var(--surface); color:var(--ink); font:inherit; max-width:210px}
.filter-row .btn{margin-left:auto}
@media (max-width:620px){.filter-row .btn{margin-left:0; width:100%}}

/* ===== Mapa esquemático ===== */
.mapbox{background:var(--surface-2); border-radius:9px; padding:18px 16px}
.mapbox-pts{display:flex; justify-content:space-between; font-family:"IBM Plex Mono",monospace;
  font-size:11.5px; color:var(--ink-2); margin-bottom:10px}
.mapbox-rail{position:relative; height:6px; background:var(--line-2); border-radius:3px}
.mapbox-rail i{display:block; height:100%; background:var(--accent); border-radius:3px}
.mapbox-dot{position:absolute; top:50%; width:13px; height:13px; border-radius:50%;
  background:var(--action); border:2.5px solid var(--surface); transform:translate(-50%,-50%);
  box-shadow:var(--shadow-1)}
.mapbox-pos{margin-top:12px; font-size:11.5px; color:var(--muted); text-align:center}


/* ===== Mapa esquemático ===== */
.map{position:relative;background:var(--surface-2);border:1px solid var(--line);
  border-radius:10px;overflow:hidden}
.map svg{display:block;width:100%;height:auto}
.mk-g{stroke:var(--line-2);stroke-width:.5;opacity:.45}
.mk-r{fill:none;stroke:var(--line-2);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.mk-rd{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;
  transition:stroke-dashoffset .6s ease}
.mk-h{fill:var(--surface);stroke:var(--line-2);stroke-width:1.5}
.mk-t{fill:var(--muted);font-size:7px;font-family:"IBM Plex Mono",monospace;text-anchor:middle}
.mk-v{fill:var(--action);stroke:var(--surface);stroke-width:2;transition:cx .6s ease,cy .6s ease}
.mk-v-h{fill:var(--action);opacity:.22;transition:cx .6s ease,cy .6s ease}
.map-note{position:absolute;right:8px;bottom:6px;font-family:"IBM Plex Mono",monospace;
  font-size:9.5px;color:var(--muted);background:color-mix(in srgb,var(--surface) 80%,transparent);
  padding:2px 7px;border-radius:4px}
.trk{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:12px;margin-top:16px}
.trk-i{display:flex;flex-direction:column;gap:2px}
.trk-i b{font-family:Archivo;font-weight:600;font-size:14.5px}
.trk-last{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;
  margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:12.5px}

/* ===== POD ===== */
.pod-req{display:flex;gap:14px;flex-wrap:wrap;padding:11px 13px;background:var(--surface-2);
  border-radius:8px}
.pod-req .chk{font-size:12.5px}
.sign-wrap{position:relative;border:1.5px dashed var(--line-2);border-radius:9px;
  background:var(--surface);overflow:hidden}
.sign-wrap canvas{display:block;width:100%;height:150px;touch-action:none;cursor:crosshair}
.sign-clear{position:absolute;right:8px;top:8px;padding:3px 9px;font-size:11.5px}
.photo-row{display:flex;gap:9px;flex-wrap:wrap}
.photo-add{border:1.5px dashed var(--line-2);border-radius:8px;padding:14px 16px;
  font-size:12.5px;color:var(--ink-2);background:var(--surface)}
.photo-add:hover{border-color:var(--action);color:var(--ink)}
.photo-thumb{display:inline-flex;flex-direction:column;gap:3px;border:1px solid var(--ok);
  background:var(--ok-soft);color:var(--ok);border-radius:8px;padding:12px 15px;font-size:12.5px;font-weight:500}
.photo-thumb em{font-style:normal;font-family:"IBM Plex Mono",monospace;font-size:10px;opacity:.8}
.empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 0}

/* ===== Acciones del transportista ===== */
.tra-actions{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:18px}
@media (max-width:620px){.tra-actions{flex-direction:column}.tra-actions .btn{width:100%}}

/* ===== Tracking público ===== */
.pub-wrap{min-height:100%;display:flex;align-items:flex-start;justify-content:center;
  padding:16px;padding-block:40px;background:var(--ground)}
.pub-card{width:100%;max-width:560px;background:var(--surface);border:1px solid var(--line);
  border-radius:14px;box-shadow:var(--shadow-2);padding:24px}
.pub-brand{display:flex;align-items:baseline;gap:9px;margin-bottom:18px}
.pub-code{font-size:23px;font-weight:600;letter-spacing:.04em}
.pub-est{margin:9px 0 14px}
.pub-route{display:flex;align-items:center;gap:10px;font-family:Archivo;font-size:16px;
  font-weight:600;margin-bottom:16px}
.pub-route span{color:var(--muted);font-weight:400}
.pub-foot{margin-top:20px;padding-top:14px;border-top:1px solid var(--line);
  font-size:11.5px;color:var(--muted)}

/* ===== Nombre de archivo ===== */
.fname{max-width:260px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.doc-layout table{min-width:720px}

/* ===== Ajustes de tabla ===== */
tr.pick td{background:var(--ok-soft)}
tr.excl td{background:var(--surface-3)}
tr.excl td:first-child{color:var(--muted)}
.score-bar{height:6px; background:var(--surface-2); border-radius:3px; overflow:hidden;
  width:58px; display:inline-block; vertical-align:middle}
.score-bar i{display:block; height:100%; background:var(--accent); border-radius:3px}
.doc-i{font-family:"IBM Plex Mono",monospace; font-size:9.5px; font-weight:500; letter-spacing:.04em;
  display:inline-block; min-width:38px; text-align:center; padding:3px 5px; border-radius:4px;
  background:var(--surface-2); color:var(--muted)}
</style>

<div id="modal-root"></div>

<script>
(function(){
"use strict";

var HOY="23 sep 2026";

var Dom={
  byId:function(id){return document.getElementById(id);},
  all:function(root,sel){return Array.prototype.slice.call(root.querySelectorAll(sel));},
  on:function(el,ev,fn){if(el)el.addEventListener(ev,fn);},
  html:function(id,h){var e=Dom.byId(id);if(e)e.innerHTML=h;},
  hide:function(id,v){var e=Dom.byId(id);if(e)e.hidden=v;}
};

var Fmt={
  num:function(n){return (n||0).toLocaleString("de-DE");},
  size:function(n){return n>=1024?(n/1024).toFixed(1).replace(".",",")+" GB"
    :n.toFixed(1).replace(".",",")+" MB";},
  pct:function(n){return Math.round(n)+"%";},
  esc:function(t){return String(t).replace(/[&<>"]/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});},
  iso:function(f){
    var p=String(f).split(" ");
    if(p.length<3) return "2099-12-31";
    return p[2]+"-"+(Seed.MESES[p[1]]||"01")+"-"+("0"+p[0]).slice(-2);
  },
  hora:function(){return HOY+" · "+Rng.int(8,18)+":"+("0"+Rng.int(0,59)).slice(-2);}
};

var Rng=(function(){
  var seed=20260923;
  function next(){seed=(seed*1103515245+12345)&0x7fffffff;return seed/0x7fffffff;}
  return {next:next,
    pick:function(a){return a[Math.floor(next()*a.length)];},
    int:function(a,b){return a+Math.floor(next()*(b-a+1));}};
})();

var UI={
  badge:function(cls,txt){
    return '<span class="badge '+cls+'"><span class="dot"></span>'+txt+'</span>';},
  pair:function(p){return UI.badge(p[0],p[1]);},
  pill:function(l,v){return '<span class="pill">'+l+' <b>'+v+'</b></span>';},
  head:function(o){
    return '<div class="ph"><div class="ph-t">'
      +(o.eyebrow?'<span class="eyebrow">'+o.eyebrow+'</span>':'')
      +'<h2>'+o.t+'</h2></div>'
      +(o.meta?'<div class="ph-meta">'+o.meta+'</div>':'')
      +(o.act?'<div class="ph-act">'+o.act+'</div>':'')+'</div>';},
  tiles:function(a){
    return '<div class="tiles">'+a.map(function(t){
      return '<div class="tile"><span class="tile-k">'+t.k+'</span>'
        +'<span class="tile-v">'+t.v+(t.u?'<small>'+t.u+'</small>':'')+'</span>'
        +(t.n?'<span class="tile-n">'+t.n+'</span>':'')+'</div>';}).join("")+'</div>';},
  card:function(title,body,act,note){
    return '<div class="card"><div class="card-head"><h3>'+title+'</h3>'
      +(act?'<span class="spacer"></span>'+act:'')+'</div>'+body
      +(note?'<div class="card-note">'+note+'</div>':'')+'</div>';},
  table:function(cols,rows){
    return '<div class="tw"><table><thead><tr>'
      +cols.map(function(c){return '<th'+(c.r?' class="r"':'')+'>'+c.t+'</th>';}).join("")
      +'</tr></thead><tbody>'+(rows||'')+'</tbody></table></div>';},
  empty:function(n,msg){
    return '<tr><td colspan="'+n+'" class="t-sub" style="padding:22px;text-align:center">'
      +msg+'</td></tr>';},
  meter:function(p,cls){
    return '<div class="meter-row"><div class="meter'+(cls||"")+'">'
      +'<i style="width:'+p+'%"></i></div><span class="mono">'+p+'%</span></div>';},
  alert:function(t,d,cls){
    return '<div class="alert '+(cls||"")+'"><span class="dot"></span><div><b>'+t+'</b>'
      +(d?'<p>'+d+'</p>':'')+'</div></div>';},
  chips:function(defs,activo,attr){
    return defs.map(function(f){
      return '<button class="chip'+(activo===f[0]?" is-on":"")+'" data-'+attr+'="'+f[0]+'">'
        +f[1]+'<span class="chip-n">'+f[2]+'</span></button>';}).join("");},
  kv:function(rows){
    return '<div class="kvlist">'+rows.map(function(r){
      return '<div class="kvrow"><span>'+r[0]+'</span><span>'+r[1]+'</span></div>';}).join("")+'</div>';},
  grid:function(rows){
    return '<div class="grid-kv">'+rows.map(function(r){
      return '<div class="kv"><span class="eyebrow">'+r[0]+'</span><b>'+r[1]+'</b></div>';}).join("")+'</div>';}
};

var Toast=(function(){
  var t=null;
  return {show:function(msg){
    var o=document.querySelector(".toast"); if(o) o.remove();
    var d=document.createElement("div"); d.className="toast"; d.textContent=msg;
    document.body.appendChild(d);
    if(t) clearTimeout(t);
    t=setTimeout(function(){if(d.parentNode)d.remove();},4200);}};
})();

var Modal=(function(){
  var abierto=false;
  function close(){abierto=false;Dom.html("modal-root","");}
  function open(title,body,footer,onWire){
    abierto=true;
    Dom.html("modal-root",
      '<div class="mbg" id="mbg"><div class="modal" role="dialog" aria-modal="true">'
      +'<div class="modal-h"><h3>'+title+'</h3><button class="btn" id="m-x">Cerrar</button></div>'
      +'<div class="modal-b">'+body+'</div>'
      +(footer?'<div class="modal-f">'+footer+'</div>':'')+'</div></div>');
    Dom.on(Dom.byId("m-x"),"click",close);
    Dom.on(Dom.byId("mbg"),"click",function(e){if(e.target.id==="mbg")close();});
    Dom.on(Dom.byId("m-cancel"),"click",close);
    if(onWire) onWire();
  }
  return {open:open,close:close,isOpen:function(){return abierto;}};
})();

var Session=(function(){
  var rol=null;
  return {
    set:function(r){rol=r;},
    clear:function(){rol=null;},
    rol:function(){return rol;},
    id:function(){return rol?rol.id:null;},
    nombre:function(){return rol?rol.name:"";},
    entidad:function(){return rol?rol.entidad:"";},
    modulos:function(){return rol?rol.mods:[];},
    puede:function(m){return rol&&rol.mods.indexOf(m)>=0;},
    clienteId:function(){return rol&&rol.cliente?rol.cliente:null;},
    traId:function(){return rol&&rol.traId?rol.traId:null;},
    esInterno:function(){return rol&&!rol.cliente&&!rol.traId;}
  };
})();

function Repo(items,clave){
  var key=clave||"id";
  return {
    all:function(){return items;},
    add:function(x){items.push(x);return x;},
    byId:function(v){
      for(var i=0;i<items.length;i++){if(items[i][key]===v)return items[i];}
      return null;},
    where:function(fn){return items.filter(fn);},
    count:function(fn){return fn?items.filter(fn).length:items.length;},
    sum:function(fn){return items.reduce(function(a,x){return a+fn(x);},0);}
  };
}

var Clientes=(function(){
  var r=Repo(Seed.CLIENTES);
  r.etapa=function(id){
    for(var i=0;i<Seed.ETAPAS.length;i++){if(Seed.ETAPAS[i].id===id)return Seed.ETAPAS[i].n;}
    return id;};
  r.badgeEtapa=function(id){
    var m={prospecto:"b-neutral",contactado:"b-accent",oportunidad:"b-warn",
           activo:"b-ok",fidelizacion:"b-ok"};
    return [m[id]||"b-neutral",r.etapa(id)];};
  r.activos=function(){return r.where(function(c){
    return c.etapa==="activo"||c.etapa==="fidelizacion";});};
  r.prospectos=function(){return r.where(function(c){
    return c.etapa==="prospecto"||c.etapa==="contactado";});};
  r.sinActividad=function(){return r.where(function(c){return Fmt.iso(c.ultima)<"2026-09-16";});};
  return r;
})();

var Documentos=(function(){
  var items=[];
  var r=Repo(items);
  r.categoria=function(id){
    for(var i=0;i<Seed.DOC_CATS.length;i++){if(Seed.DOC_CATS[i].id===id)return Seed.DOC_CATS[i];}
    return {id:id,n:id,fmt:"PDF"};};
  r.deCliente=function(id){return r.where(function(d){return d.cli===id;});};
  r.deOperacion=function(id){return r.where(function(d){return d.op===id;});};
  r.visibles=function(){
    var c=Session.clienteId();
    return c?r.deCliente(c):r.all();};
  r.pendientes=function(list){return (list||r.all()).filter(function(d){
    return d.estado==="pendiente";});};
  r.duplicados=function(list){return (list||r.all()).filter(function(d){return d.dup;});};
  r.peso=function(list){return (list||r.all()).reduce(function(a,d){return a+d.size;},0);};
  r.esDuplicado=function(op,nombre){
    return r.all().some(function(d){return d.op===op&&d.n===nombre;});};
  r.filtrar=function(base,f){
    var q=(f.q||"").toLowerCase();
    return base.filter(function(d){
      if(f.cat!=="todas"&&d.cat!==f.cat) return false;
      if(f.estado!=="todos"&&d.estado!==f.estado) return false;
      if(f.op!=="todas"&&d.op!==f.op) return false;
      if(q.length>=2&&(d.n+" "+d.op+" "+r.categoria(d.cat).n).toLowerCase().indexOf(q)<0) return false;
      return true;});};
  r.generar=function(){
    var meses=["jun","jul","ago","sep"],seq=1000;
    Operaciones.all().forEach(function(op){
      var n=op.cli==="C001"?Rng.int(26,34):Rng.int(8,14);
      for(var i=0;i<n;i++){
        var cat=Rng.pick(Seed.DOC_CATS),foto=cat.id==="inspeccion";
        var size=foto?Rng.int(18,42)+Rng.next()
          :(cat.fmt==="XLSX"?0.3+Rng.next()*0.9:1.2+Rng.next()*7.5);
        var est=Rng.next()<0.70?"aprobado"
          :(Rng.next()<0.75?"pendiente":(Rng.next()<0.6?"rechazado":"vencido"));
        seq++;
        items.push({id:"D"+seq,cli:op.cli,op:op.id,cat:cat.id,fmt:cat.fmt,
          n:cat.n.replace(/ /g,"_")+"_"+op.id+(foto?"_lote"+Rng.int(1,3):"_v"+Rng.int(1,3))
            +"."+cat.fmt.toLowerCase(),
          size:Math.round(size*10)/10,estado:est,
          fecha:Rng.int(1,28)+" "+Rng.pick(meses)+" 2026",
          por:Rng.pick(["Ana Quispe","Rodrigo Salazar","Marcela Ortiz","Sistema"]),dup:false});}});
    var base=items.filter(function(d){return d.cli==="C001";});
    for(var k=0;k<4;k++){
      var o=base[Rng.int(0,base.length-1)]; seq++;
      items.push({id:"D"+seq,cli:o.cli,op:o.op,cat:o.cat,fmt:o.fmt,n:o.n,size:o.size,
        estado:"pendiente",fecha:"21 sep 2026",por:"Marcela Ortiz",dup:true});}
    return r;};
  return r;
})().generar();

var Transportistas=(function(){
  var r=Repo(Seed.TRANSPORTISTAS);
  r.cert=function(id){
    for(var i=0;i<Seed.CERT_TIPOS.length;i++){if(Seed.CERT_TIPOS[i].id===id)return Seed.CERT_TIPOS[i];}
    return {id:id,n:id,oblig:false};};
  r.estado=function(t){
    var pend=0,mal=0;
    Seed.CERT_TIPOS.forEach(function(c){
      if(!c.oblig) return;
      var d=t.certs[c.id];
      if(d.est==="pendiente") pend++; else if(d.est!=="aprobado") mal++;});
    if(mal>0) return {cls:"b-crit",txt:"No certificado",code:"no"};
    if(pend>0) return {cls:"b-warn",txt:"Validación pendiente",code:"pend"};
    return {cls:"b-ok",txt:"Certificado",code:"ok"};};
  r.certificados=function(){return r.where(function(t){return r.estado(t).code==="ok";});};
  r.pendientesValidacion=function(){
    return r.all().reduce(function(a,t){
      return a+Seed.CERT_TIPOS.filter(function(c){return t.certs[c.id].est==="pendiente";}).length;},0);};
  return r;
})();

var Reglas=[
 {n:1,check:function(t,d){
    var st=Transportistas.estado(t);
    if(st.code==="no"){
      var f=Seed.CERT_TIPOS.filter(function(c){return c.oblig&&t.certs[c.id].est!=="aprobado";})
        .map(function(c){return c.n.toLowerCase();});
      return "Certificación no vigente: "+f.join(", ");}
    if(st.code==="pend") return "Validación de documentos pendiente";
    return null;}},
 {n:2,check:function(t,d){
    return (t.certs.seguro.est==="aprobado"&&Fmt.iso(t.certs.seguro.ven)<d.entregaISO)
      ?"Seguro vence el "+t.certs.seguro.ven+", antes de la entrega":null;}},
 {n:3,check:function(t,d){
    return (d.peligrosa&&t.certs.peligrosa.est!=="aprobado")
      ?"Sin certificación de carga peligrosa":null;}},
 {n:4,check:function(t,d){
    return t.cobertura.indexOf(d.corredor)<0?"No cubre "+d.corredor:null;}},
 {n:5,check:function(t,d){
    return t.cap*1000<d.peso?"Capacidad "+t.cap+" t < "+Fmt.num(d.peso)+" kg":null;}},
 {n:6,check:function(t,d){
    return t.disp==="no_disponible"?"No disponible en la fecha de carga":null;}}
];

var Matching={
  evaluar:function(t,d){
    for(var i=0;i<Reglas.length;i++){
      var m=Reglas[i].check(t,d);
      if(m) return {motivo:m,regla:Reglas[i].n};}
    return null;},
  puntaje:function(t,d){
    var cumpl=(t.cumpl/100)*40;
    var rot=((12-Math.min(t.asignadas30d,12))/12)*30;
    var prox=(t.en===d.origen)?20:6;
    var disp=(t.disp==="disponible")?10:0;
    return {total:Math.round(cumpl+rot+prox+disp),cumpl:Math.round(cumpl),
            rot:Math.round(rot),prox:prox,disp:disp};},
  candidatos:function(d){
    var ok=[],no=[];
    Transportistas.all().forEach(function(t){
      var r=Matching.evaluar(t,d);
      if(r) no.push({t:t,motivo:r.motivo,regla:r.regla});
      else ok.push({t:t,p:Matching.puntaje(t,d)});});
    ok.sort(function(a,b){return b.p.total-a.p.total;});
    no.sort(function(a,b){return a.regla-b.regla;});
    return {ok:ok,no:no};}
};

var Tracking={
  ruta:function(v){
    var d=Demandas.byId(v.dem);
    if(d&&Seed.RUTAS[d.corredor]) return Seed.RUTAS[d.corredor];
    var k=Object.keys(Seed.RUTAS);
    for(var i=0;i<k.length;i++){
      if(k[i].indexOf(v.origen)===0||k[i].indexOf(v.destino)>=0) return Seed.RUTAS[k[i]];}
    return Seed.RUTAS["Arica–La Paz"];},
  code:function(id){
    var b="ABCDEFGHJKMNPQRSTUVWXYZ23456789",h=0;
    for(var i=0;i<id.length;i++) h=(h*31+id.charCodeAt(i))>>>0;
    var s="";
    for(var j=0;j<6;j++){s+=b[h%b.length];h=Math.floor(h/7)+13;}
    return "DMS-"+s;},
  init:function(){
    Viajes.all().forEach(function(v){
      v.code=Tracking.code(v.id);
      var r=Tracking.ruta(v);
      v.kmTotal=r.km;
      v.km=Math.round(r.km*v.pct/100);
      v.vel=(v.estado==="transito"||v.estado==="reparto")?Rng.int(58,82):0;
      v.ultPos=v.estado==="entregado"?(v.entregado||HOY):HOY+" · 11:"+Rng.int(10,59);
      v.posHist=[{t:v.ultPos,km:v.km,pos:v.pos,vel:v.vel}];});},
  avanzar:function(v){
    var r=Tracking.ruta(v);
    if(v.pct>=100) return false;
    v.pct=Math.min(100,v.pct+Rng.int(8,16));
    v.km=Math.round(r.km*v.pct/100);
    v.vel=v.pct>=100?0:Rng.int(58,82);
    var i=Math.min(r.hitos.length-1,Math.floor(v.pct/100*r.hitos.length));
    v.pos=v.pct>=100?("Entregado en "+v.destino)
      :("Tramo "+r.hitos[i]+" · km "+Fmt.num(v.km)+" de "+Fmt.num(r.km));
    v.ultPos=Fmt.hora();
    v.posHist.unshift({t:v.ultPos,km:v.km,pos:v.pos,vel:v.vel});
    if(v.pct>=100&&v.estado!=="entregado"){
      v.estado="destino";
      v.log.unshift({t:v.ultPos,m:"Vehículo llegó a destino · pendiente de POD"});}
    return true;},
  punto:function(v){
    var r=Tracking.ruta(v),p=v.pct/100;
    var i=Math.min(r.pts.length-2,Math.floor(p*(r.pts.length-1)));
    var f=p*(r.pts.length-1)-i;
    return [r.pts[i][0]+(r.pts[i+1][0]-r.pts[i][0])*f,
            r.pts[i][1]+(r.pts[i+1][1]-r.pts[i][1])*f];}
};

var FlujoViaje={
  interno:["pendiente","asignado","confirmado","carga","transito","reparto","entregado"],
  badge:function(e){return Seed.VIAJE_EST[e]||["b-neutral","—"];},
  idxTra:function(e){
    for(var i=0;i<Seed.FLUJO_TRA.length;i++){if(Seed.FLUJO_TRA[i].id===e)return i;}
    return 0;},
  siguienteTra:function(e){return Seed.FLUJO_TRA[FlujoViaje.idxTra(e)+1]||null;},
  avanzarInterno:function(v){
    var cur=v.estado==="incidencia"?"transito":v.estado;
    var i=FlujoViaje.interno.indexOf(cur);
    if(i<0||i>=FlujoViaje.interno.length-1) return null;
    var next=FlujoViaje.interno[i+1];
    v.estado=next; v.inc=null;
    v.pct=Math.min(100,Math.round((i+2)/FlujoViaje.interno.length*100));
    v.km=Math.round(v.kmTotal*v.pct/100);
    if(next==="entregado"){
      v.pct=100; v.km=v.kmTotal; v.entregado=HOY+" · 11:30"; v.puntual=true;
      v.pos="Entregado en "+v.destino;
      var d=Demandas.byId(v.dem); if(d) d.estado="cerrada";}
    v.hitos.forEach(function(h,k){
      if(next==="entregado") h.s="done";
      else if(k<i+1) h.s="done"; else if(k===i+1) h.s="now"; else h.s="next";});
    v.log.unshift({t:HOY,m:"Estado actualizado a "+FlujoViaje.badge(next)[1]});
    return next;},
  avanzarTra:function(v,est){
    v.estado=est; v.inc=null;
    if(est==="transito"&&v.pct<20) v.pct=20;
    if(est==="destino") v.pct=Math.max(v.pct,95);
    v.km=Math.round(v.kmTotal*v.pct/100);
    var lbl=Seed.FLUJO_TRA[FlujoViaje.idxTra(est)].n;
    v.log.unshift({t:Fmt.hora(),m:"Transportista actualizó estado a "+lbl});
    return lbl;},
  incidencia:function(v,txt){
    v.estado="incidencia"; v.inc=txt; v.vel=0;
    v.log.unshift({t:Fmt.hora(),m:"Incidencia reportada · "+txt});
    Incidencias.add({viaje:v.id,t:txt,fecha:HOY});}
};

var PodService={
  requisitos:Seed.POD_REQ,
  etiquetas:{firma:"Firma",receptor:"Receptor",fotoCarga:"Foto de carga",
    fotoLugar:"Foto del lugar",obs:"Observaciones"},
  validar:function(borrador){
    var falta=[];
    if(PodService.requisitos.receptor&&borrador.receptor.length<3) falta.push("nombre del receptor");
    if(PodService.requisitos.firma&&!borrador.firma) falta.push("firma");
    if(PodService.requisitos.fotoCarga&&borrador.fotos.indexOf("carga")<0) falta.push("foto de carga");
    if(PodService.requisitos.fotoLugar&&borrador.fotos.indexOf("lugar")<0) falta.push("foto del lugar");
    if(borrador.resultado!=="completado"&&borrador.motivo.length<3) falta.push("motivo");
    return falta;},
  registrar:function(v,borrador){
    var d=Demandas.byId(v.dem);
    var pod=Pods.add({id:"POD-"+v.id.replace("VJ-",""),viaje:v.id,cli:v.cli,
      op:d?d.op:"—",estado:borrador.resultado,receptor:borrador.receptor,
      fecha:HOY+" · 11:30",gps:"-16.4897, -68.1193 (simulado)",
      obs:borrador.obs||"—",fotos:borrador.fotos.length,firma:!!borrador.firma,
      motivo:borrador.resultado==="completado"?null:borrador.motivo});
    v.log.unshift({t:pod.fecha,
      m:"POD registrado · "+Seed.POD_EST[borrador.resultado][1]+" · receptor "+borrador.receptor});
    if(borrador.resultado==="rechazado"){
      v.estado="incidencia";
      v.inc="Entrega rechazada por el receptor: "+borrador.motivo;
    } else {
      v.estado="entregado"; v.pct=100; v.km=v.kmTotal; v.vel=0;
      v.entregado=pod.fecha; v.puntual=borrador.resultado==="completado";
      v.pos="Entregado en "+v.destino;
      v.hitos.forEach(function(h){h.s="done";});
      if(d) d.estado="cerrada";}
    return pod;}
};

var Asignacion={
  publicar:function(d){d.estado="publicada";return Matching.candidatos(d).ok.length;},
  asignar:function(d){
    var c=Matching.candidatos(d);
    if(!c.ok.length) return null;
    var g=c.ok[0];
    d.tra=g.t.id; d.estado="asignada"; g.t.asignadas30d++;
    var v=Viajes.add({id:"VJ-"+(1182+Viajes.count()),dem:d.id,cli:d.cli,tra:g.t.id,
      origen:d.origen,destino:d.destino,estado:"asignado",pct:8,
      eta:d.entrega+" · 12:00",pos:"Pendiente de confirmación del transportista",inc:null,
      hitos:[{n:"Asignado",t:HOY,s:"done"},{n:"Confirmado por transportista",t:"pendiente",s:"now"},
        {n:"En carga",t:"ETA "+d.carga,s:"next"},{n:"En tránsito",t:"—",s:"next"},
        {n:"En reparto",t:"—",s:"next"},{n:"Entregado",t:"ETA "+d.entrega,s:"next"}],
      log:[{t:HOY,m:"Transportista asignado: "+g.t.n+" (puntaje "+g.p.total+")"}]});
    v.code=Tracking.code(v.id);
    var r=Tracking.ruta(v);
    v.kmTotal=r.km; v.km=Math.round(r.km*v.pct/100); v.vel=0;
    v.ultPos=HOY; v.posHist=[{t:HOY,km:v.km,pos:v.pos,vel:0}];
    return {viaje:v,ganador:g};}
};

var Certificaciones={
  aprobar:function(t,cid){t.certs[cid].est="aprobado";return Transportistas.estado(t);},
  subir:function(t,cid){t.certs[cid]={est:"pendiente",em:HOY,ven:"23 sep 2029"};},
  filas:function(pool){
    var out=[];
    pool.forEach(function(t){Seed.CERT_TIPOS.forEach(function(ct){
      out.push({t:t,ct:ct,d:t.certs[ct.id]});});});
    return out;}
};

  var folders='<button class="tnode'+(State.docCat==="todas"?" is-on":"")+'" data-doccat="todas">'
    +'<span class="tnode-n">Todas las categorías</span><span class="tnode-c">'+base.length+'</span></button>'

    +opsCli.map(function(o){return '<option value="'+o.id+'"'+(State.docOp===o.id?" selected":"")+'>'+o.id+'</option>';}).join("")
    +'</select>';
  var selEst='<select id="f-docest"><option value="todos">Todos los estados</option>'
    +Object.keys(Seed.DOC_ESTADOS).map(function(k){
      return '<option value="'+k+'"'+(State.docEstado===k?" selected":"")+'>'+Seed.DOC_ESTADOS[k][1]+'</option>';}).join("")
    +'</select>';

  var rows=slice.map(function(d){
    var e=Seed.DOC_ESTADOS[d.estado];
    return '<tr class="clickable" data-doc="'+d.id+'">'
      +'<td><span class="doc-i">'+d.fmt+'</span></td>'
      +'<td class="t-strong fname" title="'+Fmt.esc(d.n)+'">'+d.n
        +(d.dup?' '+UI.badge("b-warn","Duplicado"):'')+'</td>'

      +'<td class="mono t-sub">'+d.op+'</td>'
      +'<td class="r mono">'+Fmt.size(d.size)+'</td>'

      +'<td class="mono t-sub">'+d.fecha+'</td></tr>';}).join("");

  var pg='<div class="pg"><span>'+(lista.length?((State.docPage-1)*PAGE+1)+'–'+Math.min(State.docPage*PAGE,lista.length):0)
    +' de '+lista.length+'</span><div class="pg-b">'
    +'<button class="pg-btn" data-pg="'+(State.docPage-1)+'"'+(State.docPage<=1?" disabled":"")+'>‹</button>'
    +Array.apply(null,{length:Math.min(pages,7)}).map(function(_,i){
        var n=i+1;
        return '<button class="pg-btn'+(n===State.docPage?" is-on":"")+'" data-pg="'+n+'">'+n+'</button>';}).join("")
    +(pages>7?'<span style="padding:0 4px">…</span>':'')
    +'<button class="pg-btn" data-pg="'+(State.docPage+1)+'"'+(State.docPage>=pages?" disabled":"")+'>›</button>'
    +'</div></div>';

  return UI.tiles([
      {k:"Archivos",v:Fmt.num(base.length),n:Fmt.size(totalMB)},
      {k:"Pendientes",v:String(pend),n:"Por revisar"},
      {k:"Duplicados",v:String(dups),n:"Detectados"},
      {k:"Operaciones",v:String(opsCli.length),n:"Con documentos"}])
    + '<div class="doc-layout">'
    + '<div class="card" style="margin:0"><div class="card-head"><h3>Categorías</h3></div>'
      + '<div class="tree">'+folders+'</div></div>'
    + '<div style="min-width:0">'
      + '<div class="card"><div class="card-body" style="padding-bottom:12px">'
      + '<div class="filter-row">'

      + selOp + selEst
      + '<button class="btn btn-primary" data-subir="'+(cli||"")+'">+ Subir archivos</button>'
      + '</div></div>'
      + UI.table([{t:""},{t:"Archivo"},{t:"Categoría"},{t:"Operación"},{t:"Tamaño",r:true},{t:"Estado"},{t:"Fecha"}],
          rows||UI.empty(7,"Sin resultados"))

    + '</div></div>';

function wireModal(){
  var drop=Dom.byId("drop");
  if(drop){
    ["dragenter","dragover"].forEach(function(ev){
      drop.addEventListener(ev,function(e){e.preventDefault();drop.classList.add("is-over");});});
    ["dragleave","drop"].forEach(function(ev){
      drop.addEventListener(ev,function(e){e.preventDefault();drop.classList.remove("is-over");});});
    drop.addEventListener("drop",function(e){
      e.preventDefault();
      var f=e.dataTransfer&&e.dataTransfer.files;
      if(f&&f.length) listarArchivos(Array.prototype.slice.call(f));});
  }
  var inp=Dom.byId("f-files");
  if(inp) inp.addEventListener("change",function(){
    listarArchivos(Array.prototype.slice.call(inp.files));});
  var c=Dom.byId("m-cancel"); if(c) c.addEventListener("click",Modal.close);
  var u=Dom.byId("m-up"); if(u) u.addEventListener("click",function(){subirArchivos(u.getAttribute("data-cli"));});
}
var pendientesSubida=[];
function listarArchivos(files){
  pendientesSubida=files.map(function(f){
    return {n:f.name,size:Math.round((f.size/1048576)*10)/10||0.4};});
  Dom.byId("up-list").innerHTML='<div class="eyebrow" style="margin-bottom:8px">'+files.length+' archivo(s)</div>'
    +'<div class="docs" style="border:1px solid var(--line);border-radius:8px">'
    +pendientesSubida.map(function(f){
      return '<div class="doc"><span class="doc-n"><b>'+Fmt.esc(f.n)+'</b></span>'
        +'<span class="doc-sz">'+Fmt.size(f.size)+'</span></div>';}).join("")+'</div>';

function subirArchivos(cli){
  var op=Dom.byId("f-upop")?Dom.byId("f-upop").value:"";
  var cat=Dom.byId("f-upcat")?Dom.byId("f-upcat").value:"factura";
  var lote=pendientesSubida.length?pendientesSubida
    :[{n:"documento_"+Date.now()+".pdf",size:2.4},{n:"anexo_"+Date.now()+".pdf",size:5.1}];
  var nuevos=0,dups=0;
  lote.forEach(function(f){
    var existe=Documentos.all().some(function(d){return d.op===op&&d.n===f.n;});
    Documentos.all().push({id:"D"+(9000+Documentos.all().length),cli:cli,op:op,cat:cat,fmt:Documentos.categoria(cat).fmt,
      n:f.n,size:f.size,estado:"pendiente",fecha:"22 sep 2026",por:Session.nombre(),dup:existe});
    if(existe) dups++; else nuevos++;});
  pendientesSubida=[];
  Modal.close();
  State.docPage=1;
  Router.refresh();
  Toast.show(nuevos+" archivo(s) cargado(s) en "+op+(dups?" · "+dups+" duplicado(s) marcado(s)":""));
}

function mapaViaje(v){
  var r=Tracking.ruta(v),p=v.pct/100;
  var d="M"+r.pts.map(function(q){return q[0]+","+q[1];}).join(" L");
  var i=Math.min(r.pts.length-2,Math.floor(p*(r.pts.length-1)));
  var f=p*(r.pts.length-1)-i;
  var x=r.pts[i][0]+(r.pts[i+1][0]-r.pts[i][0])*f;
  var y=r.pts[i][1]+(r.pts[i+1][1]-r.pts[i][1])*f;
  var hitos=r.hitos.map(function(h,k){
    var q=r.pts[Math.min(k,r.pts.length-1)];
    return '<circle cx="'+q[0]+'" cy="'+q[1]+'" r="3" class="mk-h"/>'
      +'<text x="'+q[0]+'" y="'+(q[1]-9)+'" class="mk-t">'+h+'</text>';}).join("");

    +'<svg viewBox="0 0 400 200" role="img" aria-label="Recorrido '+v.origen+' a '+v.destino+'">'

    +'<path d="'+d+'" class="mk-rd" style="stroke-dasharray:1000;stroke-dashoffset:'+(1000-1000*p)+'"/>'
    +hitos
    +'<circle cx="'+x+'" cy="'+y+'" r="9" class="mk-v-h"/>'
    +'<circle cx="'+x+'" cy="'+y+'" r="5" class="mk-v"/>'

function initFirma(){
  var c=Dom.byId("pod-sign"); if(!c) return;
  var ctx=c.getContext("2d"),draw=false;
  function pos(e){
    var r=c.getBoundingClientRect();
    var t=e.touches?e.touches[0]:e;
    return [(t.clientX-r.left)*(c.width/r.width),(t.clientY-r.top)*(c.height/r.height)];}
  function start(e){e.preventDefault();draw=true;var p=pos(e);ctx.beginPath();ctx.moveTo(p[0],p[1]);}
  function move(e){if(!draw)return;e.preventDefault();var p=pos(e);
    ctx.lineTo(p[0],p[1]);ctx.strokeStyle="#0F172A";ctx.lineWidth=2.4;
    ctx.lineCap="round";ctx.lineJoin="round";ctx.stroke();podDraft.firma=true;}
  function end(){draw=false;}
  ["mousedown","touchstart"].forEach(function(e){c.addEventListener(e,start,{passive:false});});
  ["mousemove","touchmove"].forEach(function(e){c.addEventListener(e,move,{passive:false});});
  ["mouseup","mouseleave","touchend"].forEach(function(e){c.addEventListener(e,end);});
  Dom.byId("pod-clear").addEventListener("click",function(){
    ctx.clearRect(0,0,c.width,c.height);podDraft.firma=null;});
}

  doc:modalDoc, subir:modalSubir, pod:modalPOD, incidencia:modalIncidencia,

function guardarPOD(vid){
  var v=Viajes.byId(vid); if(!v) return;
  var mot=Dom.byId("pod-mot")?Dom.byId("pod-mot").value.trim():"";
  var borrador={receptor:Dom.byId("pod-rec").value.trim(),
    resultado:Dom.byId("pod-res").value,motivo:mot,
    firma:podDraft.firma,fotos:podDraft.fotos,obs:Dom.byId("pod-obs").value};
  var falta=PodService.validar(borrador);
  if(falta.length){Dom.byId("pod-err").textContent="Falta: "+falta.join(", ")+".";return;}
  var pod=PodService.registrar(v,borrador);
  Modal.close(); Router.refresh();
  Toast.show("POD "+pod.id+" registrado · "+Seed.POD_EST[borrador.resultado][1]);
}

var DocFiltro={
  aplicar:function(cli){
    var base=cli?Documentos.deCliente(cli):Documentos.visibles();
    return Documentos.filtrar(base,{cat:State.docCat,estado:State.docEstado,
      op:State.docOp,q:State.docQ});}

var Nav={
  labels:Seed.MODS,
  grupos:Seed.GRUPOS,
  contadores:function(){
    return {clientes:Clientes.count(),pipeline:Oportunidades.count(),
      actividades:Actividades.pendientes().length,
      documentos:Documentos.visibles().length,
      operaciones:Operaciones.visibles().length,

var Routes={

};

var Publico={
  code:function(){
    var h=(location.hash||"").replace(/^#\/?/,"");
    return h.indexOf("tracking/")===0?h.slice(9).toUpperCase():null;},
  render:function(code){
    Dom.hide("login",true); Dom.hide("app",true);
    Dom.html("modal-root",vPublico(code));
    var b=Dom.byId("modal-root").querySelector("[data-pubhome]");
    Dom.on(b,"click",function(){location.hash="";});}
};

var Actions={
  mod:function(el){Router.go(el.getAttribute("data-mod"));},
  go:function(el){Router.go(el.getAttribute("data-go"));},
  back:function(el){Router.go(el.getAttribute("data-back"));},
  cli:function(el){
    State.cliOpen=el.getAttribute("data-cli"); State.cliTab="resumen"; State.mod="clientes";
    State.docCat="todas"; State.docEstado="todos"; State.docOp="todas";
    State.docQ=""; State.docPage=1; Router.refresh();},
  clitab:function(el){State.cliTab=el.getAttribute("data-clitab");State.docPage=1;Router.refresh();},
  op:function(el){
    var o=Operaciones.byId(el.getAttribute("data-op")); if(!o) return;
    State.cliOpen=o.cli; State.cliTab="documentos"; State.mod="clientes";
    State.docOp=o.id; State.docCat="todas"; State.docEstado="todos";
    State.docQ=""; State.docPage=1; Router.refresh();},
  dem:function(el){State.demOpen=el.getAttribute("data-dem");State.mod="demandas";Router.refresh();},
  via:function(el){State.viaOpen=el.getAttribute("data-via");State.mod="viajes";Router.refresh();},
  viatra:function(el){State.viaOpen=el.getAttribute("data-viatra");State.mod="misviajes";Router.refresh();},
  tra:function(el){State.traOpen=el.getAttribute("data-tra");State.mod="directorio";Router.refresh();},
  filtro:function(el){State.filtro=el.getAttribute("data-filtro");State.docPage=1;Router.render();},
  doccat:function(el){State.docCat=el.getAttribute("data-doccat");State.docPage=1;Router.render();},
  pg:function(el){
    var n=parseInt(el.getAttribute("data-pg"),10);
    if(n>=1){State.docPage=n;Router.render();}},
  doc:function(el){Modales.doc(el.getAttribute("data-doc"));},
  subir:function(el){Modales.subir(el.getAttribute("data-subir")||null);},
  pub:function(el){
    var d=Demandas.byId(el.getAttribute("data-pub"));
    if(!d) return;
    var n=Asignacion.publicar(d);
    Router.refresh(); Toast.show("Demanda "+d.id+" publicada · "+n+" candidatos");},
  asig:function(el){
    var d=Demandas.byId(el.getAttribute("data-asig")); if(!d) return;
    var r=Asignacion.asignar(d);
    if(!r){Toast.show("Ningún transportista cumple los requisitos");return;}
    State.mod="viajes"; State.viaOpen=r.viaje.id; State.demOpen=null;
    Router.refresh();
    Toast.show("Asignado a "+r.ganador.t.n+" · viaje "+r.viaje.id+" creado");},
  avanzar:function(el){
    var v=Viajes.byId(el.getAttribute("data-avanzar")); if(!v) return;
    var next=FlujoViaje.avanzarInterno(v);
    if(!next) return;
    Router.refresh(); Toast.show("Viaje "+v.id+" → "+FlujoViaje.badge(next)[1]);},
  traest:function(el){
    var p=el.getAttribute("data-traest").split("|");
    var v=Viajes.byId(p[0]); if(!v) return;
    var lbl=FlujoViaje.avanzarTra(v,p[1]);
    Router.refresh(); Toast.show("Estado: "+lbl);},
  sim:function(el){
    var v=Viajes.byId(el.getAttribute("data-sim")); if(!v) return;
    if(!Tracking.avanzar(v)){Toast.show("El viaje ya llegó a destino");return;}
    Router.refresh();
    Toast.show("Posición actualizada · "+Fmt.num(v.km)+" km de "+Fmt.num(v.kmTotal));},
  pod:function(el){Modales.pod(el.getAttribute("data-pod"));},
  inc:function(el){Modales.incidencia(el.getAttribute("data-inc"));},
  track:function(el){location.hash="#/tracking/"+el.getAttribute("data-track");},
  "act-ok":function(el){
    Actividades.completar(el.getAttribute("data-act-ok"));
    Router.refresh(); Toast.show("Actividad marcada como hecha");},
  "cert-ok":function(el){
    var p=el.getAttribute("data-cert-ok").split("|");
    var t=Transportistas.byId(p[0]); if(!t) return;
    var st=Certificaciones.aprobar(t,p[1]);
    Router.refresh();
    Toast.show(st.code==="ok"?t.n+" quedó certificado"
      :Transportistas.cert(p[1]).n+" aprobada");},
  "cert-up":function(el){
    var p=el.getAttribute("data-cert-up").split("|");
    var t=Transportistas.byId(p[0]); if(!t) return;
    Certificaciones.subir(t,p[1]);
    Router.refresh();
    Toast.show(Transportistas.cert(p[1]).n+" enviada · pendiente de validación");},
  "crear-dem":function(el){Modales.demanda(el.getAttribute("data-crear-dem"));}
};

var Inputs={
  q:function(){State.q=this.value;Router.render();Inputs.focus("q");},
  "f-docq":function(){State.docQ=this.value;State.docPage=1;Router.render();Inputs.focus("f-docq");},
  "f-docop":function(){State.docOp=this.value;State.docPage=1;Router.render();},
  "f-docest":function(){State.docEstado=this.value;State.docPage=1;Router.render();},
  focus:function(id){
    var n=Dom.byId(id);
    if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length);}}
};

var Botones={
  "btn-nuevo-cli":function(){Modales.prospecto();},
  "btn-nueva-act":function(){Modales.actividad();},
  "btn-nueva-dem":function(){Modales.demanda(null);},
  "btn-nuevo-tra":function(){Modales.transportista();}
};

var Router={
  render:function(){
    var code=Publico.code();
    if(code){Publico.render(code);return;}
    Dom.html("modal-root","");
    var view=Routes[State.mod];
    Dom.html("content",view?view():"");
    Router.wire();},
  refresh:function(){Nav.render();Router.render();window.scrollTo(0,0);},
  go:function(m){State.mod=m;State.reset();Router.refresh();},
  wire:function(){
    var root=Dom.byId("content");
    Object.keys(Actions).forEach(function(k){
      Dom.all(root,"[data-"+k+"]").forEach(function(el){
        Dom.on(el,"click",function(e){e.stopPropagation();Actions[k](el);});});});
    Object.keys(Inputs).forEach(function(k){
      if(k==="focus") return;
      var el=Dom.byId(k);
      if(el) Dom.on(el,el.tagName==="SELECT"?"change":"input",Inputs[k]);});
    Object.keys(Botones).forEach(function(k){Dom.on(Dom.byId(k),"click",Botones[k]);});}
};

var Login={
  pendiente:null,
  render:function(){
    Dom.html("roles",Seed.ROLES.map(function(r){
      return '<button class="role" type="button" role="radio" aria-checked="false" data-role="'+r.id+'">'
        +'<span class="role-icon" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none" '
        +'stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">'
        +r.icon+'</svg></span>'
        +'<span class="role-txt"><span class="role-who">'+r.name+'</span>'
        +'<span class="role-rol">'+r.rol+'</span><span class="role-mail">'+r.mail+'</span></span>'
        +'<span class="role-chev" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none" '
        +'stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">'
        +'<path d="M6 3.5 10.5 8 6 12.5"/></svg></span></button>';}).join(""));
    Dom.all(Dom.byId("roles"),".role").forEach(function(b){
      Dom.on(b,"click",function(){Login.pick(b.getAttribute("data-role"));});
      Dom.on(b,"dblclick",function(){Login.pick(b.getAttribute("data-role"));Login.enter();});});
    Dom.on(Dom.byId("btn-enter"),"click",Login.enter);
    document.addEventListener("keydown",function(e){
      if(e.key==="Escape"&&Modal.isOpen()){Modal.close();return;}
      if(Dom.byId("login").hidden) return;
      if(e.key==="Enter"&&Login.pendiente){e.preventDefault();Login.enter();}});
    Login.reset();},
  reset:function(){
    Login.pendiente=null;
    Dom.all(Dom.byId("roles"),".role").forEach(function(b){
      b.classList.remove("is-picked");b.setAttribute("aria-checked","false");});
    Dom.html("login-pick",'<span class="t-sub">Sin rol seleccionado</span>');
    var b=Dom.byId("btn-enter"); b.disabled=true; b.textContent="Entrar";},
  pick:function(id){
    var r=null;
    Seed.ROLES.forEach(function(x){if(x.id===id)r=x;});
    if(!r) return;
    Login.pendiente=r;
    Dom.all(Dom.byId("roles"),".role").forEach(function(b){
      var on=b.getAttribute("data-role")===id;
      b.classList.toggle("is-picked",on);b.setAttribute("aria-checked",on?"true":"false");});
    Dom.html("login-pick",'<b>'+r.name+'</b><span class="t-sub">'+r.entidad+'</span>');
    var btn=Dom.byId("btn-enter"); btn.disabled=false; btn.textContent="Entrar";},
  enter:function(){
    if(!Login.pendiente) return;
    Session.set(Login.pendiente);
    State.mod=Session.modulos()[0]; State.reset(); State.filtro="todos";
    Dom.hide("login",true); Dom.hide("app",false);
    Dom.byId("who-name").textContent=Session.nombre();
    Dom.byId("who-rol").textContent=Session.entidad();
    Router.refresh();},
  leave:function(){
    Session.clear();
    Dom.hide("app",true); Dom.hide("login",false);
    Login.reset(); window.scrollTo(0,0);}
};

window.addEventListener("hashchange",function(){
  if(Publico.code()){Router.render();return;}
  Dom.html("modal-root","");
  if(Session.rol()){Dom.hide("app",false);Router.render();}
  else Dom.hide("login",false);});

Login.render();
Dom.on(Dom.byId("btn-salir"),"click",Login.leave);
if(Publico.code()) Router.render();
})();
</script>
